plugins {
    id 'com.android.application'
}
android {
    namespace 'com.nexus.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nexus.app'
        minSdk 26
        targetSdk 35
        versionCode 32
        versionName '0.22.3-secure-lock'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }
    packaging {
        jniLibs { useLegacyPackaging true; excludes += ["**/*_testing*"] }
        resources { excludes += ["**/*.dylib", "**/*.dll", "**/*_testing*"] }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.signal:libsignal-client:0.104.0'
    implementation 'org.signal:libsignal-android:0.104.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}