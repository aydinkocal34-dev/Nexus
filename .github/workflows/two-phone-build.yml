name: NEXUS Two-Phone Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: CI diagnostics
        run: |
          echo "NEXUS CI START"
          echo "runner=$RUNNER_NAME"
          echo "os=$RUNNER_OS"
          echo "sha=$GITHUB_SHA"
          echo "run=$GITHUB_RUN_NUMBER"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uname -a

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare Gradle
        run: |
          mkdir -p /tmp/nexus-gradle
          cd /tmp/nexus-gradle
          printf 'rootProject.name="bootstrap"\n' > settings.gradle
          gradle wrapper --gradle-version 8.13

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package.json

      - name: Relay server tests
        run: |
          cd server
          npm install --no-audit --no-fund
          npm test

      - name: JVM tests
        run: /tmp/nexus-gradle/gradlew -p "$GITHUB_WORKSPACE" :app:test --stacktrace --no-daemon

      - name: Build ARM64 APK
        run: /tmp/nexus-gradle/gradlew -p "$GITHUB_WORKSPACE" :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name 'app-arm64-v8a-debug.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/NEXUS-0.22.2-arm64.apk
          test -s dist/NEXUS-0.22.2-arm64.apk
          shasum -a 256 dist/NEXUS-0.22.2-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-two-phone-arm64
          path: dist/NEXUS-0.22.2-arm64.apk
