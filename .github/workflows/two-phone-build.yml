name: NEXUS Two-Phone Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package.json

      - name: Relay server tests
        run: |
          echo "== Relay tests START =="
          cd server
          npm install --no-audit --no-fund
          npm test
          echo "== Relay tests END =="

      - name: JVM tests + ARM64 APK
        run: |
          echo "== Android tests/build START =="
          date -u
          gradle -p "$GITHUB_WORKSPACE" :app:test :app:assembleDebug --stacktrace --no-daemon
          date -u
          echo "== Android tests/build END =="

      - name: Prepare APK
        run: |
          set -e
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name 'app-arm64-v8a-debug.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/NEXUS-0.22.3-secure-lock-arm64.apk
          test -s dist/NEXUS-0.22.3-secure-lock-arm64.apk
          echo "APK: dist/NEXUS-0.22.3-secure-lock-arm64.apk"
          shasum -a 256 dist/NEXUS-0.22.3-secure-lock-arm64.apk

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-two-phone-arm64
          path: dist/NEXUS-0.22.3-secure-lock-arm64.apk
