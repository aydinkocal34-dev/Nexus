name: Relay Live Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/relay-live.yml'

jobs:
  live-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install relay dependencies
        run: cd relay && npm ci
      - name: Exercise public WSS relay
        env:
          RELAY_URL: wss://nexus-blind-relay.onrender.com
        run: |
          node <<'NODE'
          const WebSocket = require('./relay/node_modules/ws');
          const url = process.env.RELAY_URL;
          const wait = (ms) => new Promise(r => setTimeout(r, ms));
          function client(peerId) {
            return new Promise((resolve, reject) => {
              const ws = new WebSocket(url);
              const messages = [];
              const timer = setTimeout(() => reject(new Error(peerId + ' connect timeout')), 15000);
              ws.on('open', () => {
                clearTimeout(timer);
                ws.send(JSON.stringify({type:'register', peerId}));
                resolve({ws, messages});
              });
              ws.on('message', b => { try { messages.push(JSON.parse(b.toString())); } catch(e) {} });
              ws.on('error', reject);
            });
          }
          async function waitFor(arr, predicate, label) {
            const end = Date.now() + 10000;
            while (Date.now() < end) {
              const x = arr.find(predicate);
              if (x) return x;
              await wait(50);
            }
            throw new Error('timeout waiting for ' + label + ': ' + JSON.stringify(arr));
          }
          (async () => {
            const A = await client('test-peer-A-20261003');
            const B = await client('test-peer-B-20261003');
            await waitFor(A.messages, m => m.type === 'registered', 'A registered');
            await waitFor(B.messages, m => m.type === 'registered', 'B registered');

            const id = 'live-smoke-20261003-001';
            const payload = 'OPAQUE-CIPHERTEXT-TEST-' + Date.now();
            A.ws.send(JSON.stringify({
              type:'relay', id, toPeerId:'test-peer-B-20261003',
              ciphertext:payload, ciphertextType:'signal-sealed-box',
              fromDeviceId:'device-A-01', ttlMs:60000
            }));
            const got = await waitFor(B.messages, m => m.type === 'ciphertext' && m.id === id, 'ciphertext A->B');
            if (got.ciphertext !== payload || got.from !== 'test-peer-A-20261003' || got.fromDeviceId !== 'device-A-01') throw new Error('ciphertext integrity mismatch: '+JSON.stringify(got));

            B.ws.send(JSON.stringify({type:'ack', id, toPeerId:'test-peer-A-20261003'}));
            await waitFor(A.messages, m => m.type === 'delivery' && m.id === id && m.status === 'read', 'ACK delivery');

            A.ws.send(JSON.stringify({
              type:'relay', id, toPeerId:'test-peer-B-20261003',
              ciphertext:payload, ciphertextType:'signal-sealed-box',
              fromDeviceId:'device-A-01', ttlMs:60000
            }));
            await waitFor(A.messages, m => m.type === 'delivery' && m.id === id && m.status === 'replay', 'replay rejection');

            A.ws.send(JSON.stringify({
              type:'relay', id:'offline-001', toPeerId:'test-peer-OFFLINE-20261003',
              ciphertext:'opaque', ciphertextType:'signal-sealed-box',
              fromDeviceId:'device-A-01', ttlMs:60000
            }));
            await waitFor(A.messages, m => m.type === 'delivery' && m.id === 'offline-001' && m.status === 'offline', 'offline delivery');

            console.log('LIVE_RELAY_SMOKE_PASS');
            console.log(JSON.stringify({registered:true, ciphertext:true, ack:true, replayRejected:true, offline:true}));
            A.ws.close(); B.ws.close();
          })().catch(e => { console.error('LIVE_RELAY_SMOKE_FAIL', e); process.exit(1); });
          NODE
