name: NEXUS Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1 — CHECKOUT
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # 2 — JAVA 21
      # ==================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ==================================================
      # 3 — ANDROID SDK
      # ==================================================
      - name: Check Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==================================================
      # 4 — GRADLE 9.5
      # ==================================================
      - name: Prepare Gradle wrapper
        run: |
          mkdir -p gradle/wrapper

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = "NEXUS"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
          }
          EOF

          gradle wrapper --gradle-version 9.5

          chmod +x gradlew

          ./gradlew --version

      # ==================================================
      # 5 — PROJECT
      # ==================================================
      - name: Create NEXUS project
        run: |
          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/nexus/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()

                  maven {
                      name = "SignalBuildArtifacts"
                      url = uri(
                          "https://build-artifacts.signal.org/libraries/maven/"
                      )
                  }
              }
          }

          rootProject.name = "NEXUS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexus.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexus.app'
                  minSdk 26
                  targetSdk 35

                  versionCode 10
                  versionName '0.10.0-session'

                  testInstrumentationRunner \
                      'androidx.test.runner.AndroidJUnitRunner'
              }

              compileOptions {
                  coreLibraryDesugaringEnabled true

                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }

                  debug {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation \
                  'androidx.appcompat:appcompat:1.7.0'

              implementation \
                  'androidx.core:core:1.15.0'

              implementation \
                  'com.squareup.okhttp3:okhttp:4.12.0'

              implementation \
                  'org.signal:libsignal-client:0.102.2'

              implementation \
                  'org.signal:libsignal-android:0.102.2'

              coreLibraryDesugaring \
                  'com.android.tools:desugar_jdk_libs:2.1.5'

              testImplementation \
                  'junit:junit:4.13.2'
          }
          EOF

      # ==================================================
      # 6 — MANIFEST
      # ==================================================
      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="NEXUS"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ==================================================
      # 7 — THEME
      # ==================================================
      - name: Create theme
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

              </style>

          </resources>
          EOF

      # ==================================================
      # 8 — DEVICE IDENTITY
      # ==================================================
      - name: Create IdentityStore
        run: |
          cat > app/src/main/java/com/nexus/app/IdentityStore.java <<'EOF'
          package com.nexus.app;

          import java.security.KeyPair;
          import java.security.KeyPairGenerator;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.spec.ECGenParameterSpec;

          public final class IdentityStore {

              private static final String ALIAS =
                      "nexus_device_identity_v1";

              private IdentityStore() {}

              public static KeyPair getOrCreateIdentity()
                      throws Exception {

                  KeyStore keyStore =
                          KeyStore.getInstance(
                                  "AndroidKeyStore"
                          );

                  keyStore.load(null);

                  if (keyStore.containsAlias(ALIAS)) {

                      KeyStore.PrivateKeyEntry entry =
                              (KeyStore.PrivateKeyEntry)
                                      keyStore.getEntry(
                                              ALIAS,
                                              null
                                      );

                      return new KeyPair(
                              entry.getCertificate()
                                      .getPublicKey(),
                              entry.getPrivateKey()
                      );
                  }

                  KeyPairGenerator generator =
                          KeyPairGenerator.getInstance(
                                  "EC",
                                  "AndroidKeyStore"
                          );

                  generator.initialize(
                          new ECGenParameterSpec(
                                  "secp256r1"
                          )
                  );

                  return generator.generateKeyPair();
              }

              public static String fingerprint()
                      throws Exception {

                  KeyPair pair =
                          getOrCreateIdentity();

                  MessageDigest digest =
                          MessageDigest.getInstance(
                                  "SHA-256"
                          );

                  byte[] hash =
                          digest.digest(
                              pair.getPublic()
                                  .getEncoded()
                          );

                  StringBuilder result =
                          new StringBuilder();

                  for (byte b : hash) {

                      result.append(
                          String.format(
                              "%02X",
                              b
                          )
                      );
                  }

                  return result.substring(
                          0,
                          32
                  );
              }
          }
          EOF

      # ==================================================
      # 9 — SECURE SESSION STORE
      # ==================================================
      - name: Create SessionStore
        run: |
          cat > app/src/main/java/com/nexus/app/SessionStore.java <<'EOF'
          package com.nexus.app;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;

          /**
           * NEXUS session state storage foundation.
           *
           * This layer stores only encrypted/opaque session
           * state supplied by the Signal layer.
           *
           * It does not implement cryptography itself.
           */
          public final class SessionStore {

              private static final String PREFS =
                      "nexus_signal_session_store";

              private static final String KEY_STATE =
                      "session_state";

              private SessionStore() {}

              private static SharedPreferences prefs(
                      Context context) {

                  return context.getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                  );
              }

              public static void saveState(
                      Context context,
                      String state) {

                  if (state == null) {
                      return;
                  }

                  prefs(context)
                          .edit()
                          .putString(
                                  KEY_STATE,
                                  state
                          )
                          .apply();
              }

              public static String loadState(
                      Context context) {

                  return prefs(context)
                          .getString(
                                  KEY_STATE,
                                  null
                          );
              }

              public static void clear(
                      Context context) {

                  prefs(context)
                          .edit()
                          .remove(KEY_STATE)
                          .apply();
              }

              public static boolean exists(
                      Context context) {

                  return loadState(context) != null;
              }

              public static String stateFingerprint(
                      Context context)
                      throws Exception {

                  String state =
                          loadState(context);

                  if (state == null) {
                      return "NO_SESSION";
                  }

                  MessageDigest digest =
                          MessageDigest.getInstance(
                                  "SHA-256"
                          );

                  byte[] hash =
                          digest.digest(
                              state.getBytes(
                                  StandardCharsets.UTF_8
                              )
                          );

                  StringBuilder result =
                          new StringBuilder();

                  for (byte b : hash) {

                      result.append(
                          String.format(
                              "%02X",
                              b
                          )
                      );
                  }

                  return result.substring(
                          0,
                          32
                  );
              }
          }
          EOF

      # ==================================================
      # 10 — SESSION MODEL
      # ==================================================
      - name: Create SignalSession
        run: |
          cat > app/src/main/java/com/nexus/app/SignalSession.java <<'EOF'
          package com.nexus.app;

          /**
           * Represents the NEXUS-side state of a peer session.
           *
           * No custom encryption is performed here.
           */
          public final class SignalSession {

              private final String peerId;

              private final String peerFingerprint;

              private boolean established;

              public SignalSession(
                      String peerId,
                      String peerFingerprint) {

                  this.peerId = peerId;

                  this.peerFingerprint =
                          peerFingerprint;

                  this.established = false;
              }

              public String getPeerId() {
                  return peerId;
              }

              public String getPeerFingerprint() {
                  return peerFingerprint;
              }

              public boolean isEstablished() {
                  return established;
              }

              public void markEstablished() {
                  established = true;
              }

              public void markClosed() {
                  established = false;
              }
          }
          EOF

      # ==================================================
      # 11 — SIGNAL ENGINE
      # ==================================================
      - name: Create SignalEngine
        run: |
          cat > app/src/main/java/com/nexus/app/SignalEngine.java <<'EOF'
          package com.nexus.app;

          import android.content.Context;

          /**
           * NEXUS Signal integration boundary.
           *
           * IMPORTANT:
           * No custom cryptography is implemented here.
           *
           * The real libsignal session API will be connected
           * after the storage/session layer is verified.
           */
          public final class SignalEngine {

              public static final String VERSION =
                      "0.10.0-session";

              public static final String LIBSIGNAL =
                      "0.102.2";

              private SignalEngine() {}

              public static boolean isSignalAvailable() {
                  return true;
              }

              public static void initialize(
                      Context context) {

                  /*
                   * Touch the session store so the storage
                   * path is initialized and testable.
                   */
                  SessionStore.exists(context);
              }

              public static String status(
                      Context context) {

                  if (SessionStore.exists(context)) {

                      return
                          "Signal: session state mevcut";
                  }

                  return
                      "Signal: session state yok";
              }
          }
          EOF

      # ==================================================
      # 12 — MAIN ACTIVITY
      # ==================================================
      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/nexus/app/MainActivity.java <<'EOF'
          package com.nexus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity
                  extends Activity {

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(
                          savedInstanceState
                  );

                  getWindow().setFlags(
                          WindowManager.LayoutParams
                                  .FLAG_SECURE,
                          WindowManager.LayoutParams
                                  .FLAG_SECURE
                  );

                  SignalEngine.initialize(this);

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          40,
                          50,
                          40,
                          40
                  );

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "NEXUS\n" +
                          "0.10.0 • SESSION"
                  );

                  title.setTextSize(30);

                  root.addView(title);

                  TextView identity =
                          new TextView(this);

                  try {

                      identity.setText(
                          "\nDevice fingerprint:\n" +
                          IdentityStore.fingerprint()
                      );

                  } catch (Exception e) {

                      identity.setText(
                          "\nFingerprint unavailable"
                      );
                  }

                  identity.setTextSize(17);

                  root.addView(identity);

                  TextView session =
                          new TextView(this);

                  session.setText(
                      "\n\nSignal session layer\n\n" +
                      "libsignal: " +
                      SignalEngine.LIBSIGNAL +
                      "\n" +
                      SignalEngine.status(this) +
                      "\n\n" +
                      "✓ Keystore identity" +
                      "\n" +
                      "✓ Session storage foundation" +
                      "\n" +
                      "✓ Peer session model" +
                      "\n" +
                      "✓ Replay protection" +
                      "\n\n" +
                      "Gerçek Signal session " +
                      "henüz kurulmuş değil."
                  );

                  session.setTextSize(16);

                  root.addView(session);

                  setContentView(root);
              }
          }
          EOF

      # ==================================================
      # 13 — TESTS
      # ==================================================
      - name: Create tests
        run: |
          cat > app/src/test/java/com/nexus/app/SessionModelTest.java <<'EOF'
          package com.nexus.app;

          import org.junit.Test;

          import static org.junit.Assert.assertFalse;
          import static org.junit.Assert.assertTrue;

          public class SessionModelTest {

              @Test
              public void sessionStartsClosed() {

                  SignalSession session =
                          new SignalSession(
                              "NX-TEST",
                              "ABCDEF"
                          );

                  assertFalse(
                          session.isEstablished()
                  );
              }

              @Test
              public void sessionCanBeEstablished() {

                  SignalSession session =
                          new SignalSession(
                              "NX-TEST",
                              "ABCDEF"
                          );

                  session.markEstablished();

                  assertTrue(
                          session.isEstablished()
                  );
              }

              @Test
              public void sessionCanBeClosed() {

                  SignalSession session =
                          new SignalSession(
                              "NX-TEST",
                              "ABCDEF"
                          );

                  session.markEstablished();
                  session.markClosed();

                  assertFalse(
                          session.isEstablished()
                  );
              }
          }
          EOF

          cat > app/src/test/java/com/nexus/app/ReplayGuardTest.java <<'EOF'
          package com.nexus.app;

          import org.junit.Test;

          import static org.junit.Assert.assertFalse;
          import static org.junit.Assert.assertTrue;

          public class ReplayGuardTest {

              @Test
              public void duplicateRejected() {

                  ReplayGuard guard =
                          new ReplayGuard();

                  assertTrue(
                          guard.accept("message-1")
                  );

                  assertFalse(
                          guard.accept("message-1")
                  );
              }

              @Test
              public void differentMessagesAccepted() {

                  ReplayGuard guard =
                          new ReplayGuard();

                  assertTrue(
                          guard.accept("message-1")
                  );

                  assertTrue(
                          guard.accept("message-2")
                  );
              }
          }
          EOF

      # ==================================================
      # 14 — UNIT TEST
      # ==================================================
      - name: Run unit tests
        run: |
          ./gradlew test

      # ==================================================
      # 15 — BUILD
      # ==================================================
      - name: Build debug APK
        run: |
          ./gradlew assembleDebug

      # ==================================================
      # 16 — VERIFY
      # ==================================================
      - name: Verify APK
        run: |
          ls -lh \
              app/build/outputs/apk/debug/

          sha256sum \
              app/build/outputs/apk/debug/app-debug.apk

      # ==================================================
      # 17 — ARTIFACT
      # ==================================================
      - name: Upload NEXUS 0.10 APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-SESSION-0.10-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14