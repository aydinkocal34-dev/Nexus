name: NEXUS Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses >/dev/null 2>&1 || true
          "$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create isolated Gradle wrapper
        run: |
          rm -rf /tmp/nexus-gradle
          mkdir -p /tmp/nexus-gradle
          cd /tmp/nexus-gradle
          printf 'rootProject.name="bootstrap"\n' > settings.gradle
          gradle wrapper --gradle-version 9.5.1

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/nexus/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url = uri("https://build-artifacts.signal.org/libraries/maven/") }
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://build-artifacts.signal.org/libraries/maven/") }
              }
          }

          rootProject.name = "NEXUS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexus.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexus.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 11
                  versionName '0.10.1-session-fix'
              }

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.15.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'org.signal:libsignal-client:0.102.2'
              implementation 'org.signal:libsignal-android:0.102.2'
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
              testImplementation 'junit:junit:4.13.2'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="NEXUS"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/nexus/app/MainActivity.java <<'EOF'
          package com.nexus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  TextView t = new TextView(this);
                  t.setPadding(40,80,40,40);
                  t.setTextSize(18);
                  t.setText(
                      "NEXUS\n\n" +
                      "0.10.1 SESSION FIX\n\n" +
                      "Android altyapısı hazır.\n\n" +
                      "Signal kütüphanesi bağlı.\n" +
                      "Gerçek Signal oturumu henüz aktif değil.\n\n" +
                      "Ekran görüntüsü koruması aktif."
                  );

                  setContentView(t);
              }
          }
          EOF

          cat > app/src/test/java/com/nexus/app/ReplayGuardTest.java <<'EOF'
          package com.nexus.app;

          import org.junit.Test;
          import java.util.HashSet;
          import java.util.Set;
          import static org.junit.Assert.*;

          public class ReplayGuardTest {
              @Test
              public void duplicateIsRejected() {
                  Set<String> seen = new HashSet<>();
                  assertTrue(seen.add("message-1"));
                  assertFalse(seen.add("message-1"));
              }
          }
          EOF

      - name: Run tests
        run: |
          /tmp/nexus-gradle/gradlew -p "$GITHUB_WORKSPACE" test --stacktrace

      - name: Build APK
        run: |
          /tmp/nexus-gradle/gradlew -p "$GITHUB_WORKSPACE" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-0.10.1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14