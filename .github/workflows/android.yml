name: NEXUS Android E2EE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Create NEXUS project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      name = "SignalBuildArtifacts"
                      url = uri("https://build-artifacts.signal.org/libraries/maven/")
                  }
              }
          }

          rootProject.name = "NEXUS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexus.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexus.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 6
                  versionName '0.6.0-identity'
              }

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += [
                          "libsignal_jni*.dylib",
                          "signal_jni*.dll"
                      ]
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
              implementation 'org.signal:libsignal-client:0.102.2'
              implementation 'org.signal:libsignal-android:0.102.2'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="NEXUS"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00C2FF</item>
                  <item name="android:statusBarColor">#080A0F</item>
                  <item name="android:navigationBarColor">#080A0F</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/nexus/app/MainActivity.java <<'EOF'
          package com.nexus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.security.KeyPair;
          import java.security.KeyPairGenerator;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private final int BG = Color.rgb(8,10,15);
              private final int CARD = Color.rgb(20,24,32);

              private final Handler handler = new Handler();

              private SharedPreferences prefs;

              private static final String KEYSTORE_ALIAS =
                      "nexus_device_identity_v1";

              private int dp(int value) {
                  return (int)(
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density + 0.5f
                  );
              }

              private TextView text(
                      String value,
                      float size
              ) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  return t;
              }

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  prefs = getSharedPreferences(
                      "nexus_user",
                      Context.MODE_PRIVATE
                  );

                  if (
                      prefs.getBoolean(
                          "registered",
                          false
                      )
                  ) {
                      showHome();
                  } else {
                      showWelcome();
                  }
              }

              private LinearLayout page(
                      String title
              ) {
                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      dp(20),
                      dp(30),
                      dp(20),
                      dp(20)
                  );

                  root.setBackgroundColor(BG);

                  TextView titleView =
                      text(title, 28);

                  titleView.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  root.addView(
                      titleView,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(60)
                      )
                  );

                  return root;
              }

              private Button button(
                      String value
              ) {
                  Button b =
                      new Button(this);

                  b.setText(value);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(16);
                  b.setAllCaps(false);
                  b.setBackgroundColor(CARD);

                  return b;
              }

              /*
               * Android Keystore:
               *
               * The private key never leaves the device.
               * Only the public key is fingerprinted.
               */
              private String ensureDeviceFingerprint() {

                  try {

                      KeyStore ks =
                          KeyStore.getInstance(
                              "AndroidKeyStore"
                          );

                      ks.load(null);

                      if (
                          !ks.containsAlias(
                              KEYSTORE_ALIAS
                          )
                      ) {

                          KeyPairGenerator generator =
                              KeyPairGenerator.getInstance(
                                  KeyProperties
                                      .KEY_ALGORITHM_EC,
                                  "AndroidKeyStore"
                              );

                          generator.initialize(
                              new KeyGenParameterSpec.Builder(
                                  KEYSTORE_ALIAS,
                                  KeyProperties.PURPOSE_SIGN |
                                  KeyProperties.PURPOSE_VERIFY
                              )
                              .setAlgorithmParameterSpec(
                                  new java.security
                                      .spec
                                      .ECGenParameterSpec(
                                          "secp256r1"
                                      )
                              )
                              .setDigests(
                                  KeyProperties.DIGEST_SHA256
                              )
                              .build()
                          );

                          generator.generateKeyPair();
                      }

                      java.security.cert.Certificate certificate =
                          ks.getCertificate(
                              KEYSTORE_ALIAS
                          );

                      byte[] publicKey =
                          certificate
                              .getPublicKey()
                              .getEncoded();

                      byte[] digest =
                          MessageDigest
                              .getInstance("SHA-256")
                              .digest(publicKey);

                      StringBuilder hex =
                          new StringBuilder();

                      for (byte b : digest) {
                          hex.append(
                              String.format(
                                  "%02X",
                                  b
                              )
                          );
                      }

                      return hex
                          .toString()
                          .substring(0, 32);

                  } catch (Exception e) {

                      return "KEYSTORE-ERROR";
                  }
              }

              private void showWelcome() {

                  LinearLayout root =
                      page("NEXUS");

                  TextView subtitle =
                      text(
                          "Özel ve güvenli " +
                          "mesajlaşmaya hoş geldin.",
                          17
                      );

                  subtitle.setTextColor(
                      Color.LTGRAY
                  );

                  root.addView(subtitle);

                  TextView explanation =
                      text(
                          "\nÖnce NEXUS kimliğini " +
                          "oluşturalım.\n\n" +
                          "Kullanıcı bilgilerin " +
                          "şu aşamada yalnızca " +
                          "bu telefonda saklanır.\n\n" +
                          "Cihaz güvenlik anahtarın " +
                          "Android Keystore'da " +
                          "oluşturulur.",
                          15
                      );

                  explanation.setTextColor(
                      Color.GRAY
                  );

                  root.addView(explanation);

                  EditText name =
                      new EditText(this);

                  name.setHint(
                      "Adın / kullanıcı adın"
                  );

                  name.setHintTextColor(
                      Color.GRAY
                  );

                  name.setTextColor(
                      Color.WHITE
                  );

                  LinearLayout.LayoutParams np =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(65)
                      );

                  np.topMargin = dp(25);

                  root.addView(name, np);

                  Button create =
                      button(
                          "NEXUS kimliğimi oluştur"
                      );

                  LinearLayout.LayoutParams cp =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(65)
                      );

                  cp.topMargin = dp(15);

                  root.addView(create, cp);

                  TextView error =
                      text("", 14);

                  error.setTextColor(
                      Color.rgb(
                          255,
                          100,
                          100
                      )
                  );

                  root.addView(error);

                  create.setOnClickListener(v -> {

                      String username =
                          name.getText()
                              .toString()
                              .trim();

                      if (
                          username.length() < 3
                      ) {

                          error.setText(
                              "En az 3 karakter gir."
                          );

                          return;
                      }

                      String id =
                          createNexusId();

                      ensureDeviceFingerprint();

                      prefs.edit()
                          .putBoolean(
                              "registered",
                              true
                          )
                          .putString(
                              "username",
                              username
                          )
                          .putString(
                              "nexus_id",
                              id
                          )
                          .apply();

                      showIdentity(
                          username,
                          id
                      );
                  });

                  setContentView(root);
              }

              private String createNexusId() {

                  String raw =
                      UUID.randomUUID()
                          .toString()
                          .replace(
                              "-",
                              ""
                          )
                          .toUpperCase();

                  return "NX-" +
                      raw.substring(0,4) +
                      "-" +
                      raw.substring(4,8) +
                      "-" +
                      raw.substring(8,12);
              }

              private void showIdentity(
                      String username,
                      String id
              ) {

                  LinearLayout root =
                      page("Kimliğin hazır");

                  TextView welcome =
                      text(
                          "Hoş geldin, " +
                          username +
                          " 👋",
                          22
                      );

                  welcome.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  root.addView(welcome);

                  String fingerprint =
                      ensureDeviceFingerprint();

                  TextView idText =
                      text(
                          "\nSenin NEXUS ID'n:\n\n" +
                          id +
                          "\n\nCihaz güvenlik " +
                          "parmak izin:\n" +
                          fingerprint +
                          "\n\nBu parmak izi " +
                          "ileride güvenli kimlik " +
                          "doğrulamada kullanılacak.",
                          15
                      );

                  idText.setTextColor(
                      Color.LTGRAY
                  );

                  root.addView(idText);

                  Button continueButton =
                      button(
                          "NEXUS'a devam et"
                      );

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(65)
                      );

                  p.topMargin = dp(30);

                  root.addView(
                      continueButton,
                      p
                  );

                  continueButton.setOnClickListener(
                      v -> showHome()
                  );

                  setContentView(root);
              }

              private void showHome() {

                  LinearLayout root =
                      page("NEXUS");

                  String username =
                      prefs.getString(
                          "username",
                          "Kullanıcı"
                      );

                  String id =
                      prefs.getString(
                          "nexus_id",
                          "NX-UNKNOWN"
                      );

                  TextView profile =
                      text(
                          username +
                          "\n" +
                          id,
                          15
                      );

                  profile.setTextColor(
                      Color.LTGRAY
                  );

                  root.addView(profile);

                  TextView chats =
                      text(
                          "Sohbetler",
                          21
                      );

                  chats.setPadding(
                      0,
                      dp(25),
                      0,
                      dp(10)
                  );

                  root.addView(chats);

                  Button ali =
                      button(
                          "Ali\nÇevrimiçi"
                      );

                  root.addView(
                      ali,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(75)
                      )
                  );

                  ali.setOnClickListener(
                      v -> showChat("Ali")
                  );

                  Button newChat =
                      button(
                          "+ Yeni sohbet"
                      );

                  LinearLayout.LayoutParams np =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(60)
                      );

                  np.topMargin = dp(15);

                  root.addView(
                      newChat,
                      np
                  );

                  newChat.setOnClickListener(
                      v -> showNewChat()
                  );

                  TextView info =
                      text(
                          "\nNEXUS kimliği hazır.\n\n" +
                          "Cihaz anahtarı Android " +
                          "Keystore tarafından " +
                          "korunuyor.\n\n" +
                          "Gerçek kullanıcı keşfi ve " +
                          "sunucu bağlantısı sonraki " +
                          "aşamada eklenecek.",
                          13
                      );

                  info.setTextColor(
                      Color.GRAY
                  );

                  root.addView(info);

                  setContentView(root);
              }

              private void showNewChat() {

                  LinearLayout root =
                      page("Yeni sohbet");

                  EditText id =
                      new EditText(this);

                  id.setHint(
                      "NEXUS ID"
                  );

                  id.setHintTextColor(
                      Color.GRAY
                  );

                  id.setTextColor(
                      Color.WHITE
                  );

                  root.addView(
                      id,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(65)
                      )
                  );

                  Button search =
                      button(
                          "Kişiyi bul"
                      );

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(60)
                      );

                  p.topMargin = dp(15);

                  root.addView(
                      search,
                      p
                  );

                  search.setOnClickListener(
                      v -> {

                          String target =
                              id.getText()
                                  .toString()
                                  .trim();

                          if (
                              target.isEmpty()
                          ) {
                              return;
                          }

                          showChat(
                              "NEXUS kullanıcısı"
                          );
                      }
                  );

                  setContentView(root);
              }

              private void showChat(
                      String person
              ) {

                  LinearLayout root =
                      page(person);

                  Button back =
                      button(
                          "‹ Sohbetlere dön"
                      );

                  root.addView(
                      back,
                      0,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(48)
                      )
                  );

                  back.setOnClickListener(
                      v -> showHome()
                  );

                  ScrollView scroll =
                      new ScrollView(this);

                  LinearLayout messages =
                      new LinearLayout(this);

                  messages.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  scroll.addView(messages);

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  LinearLayout bar =
                      new LinearLayout(this);

                  bar.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  EditText input =
                      new EditText(this);

                  input.setHint(
                      "Mesaj…"
                  );

                  input.setHintTextColor(
                      Color.GRAY
                  );

                  input.setTextColor(
                      Color.WHITE
                  );

                  Button send =
                      button(
                          "Gönder"
                      );

                  bar.addView(
                      input,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(60),
                          1
                      )
                  );

                  bar.addView(
                      send,
                      new LinearLayout.LayoutParams(
                          dp(95),
                          dp(60)
                      )
                  );

                  root.addView(bar);

                  send.setOnClickListener(
                      v -> {

                          String message =
                              input.getText()
                                  .toString()
                                  .trim();

                          if (
                              message.isEmpty()
                          ) {
                              return;
                          }

                          addMessage(
                              messages,
                              message
                          );

                          input.setText("");

                          scroll.post(
                              () -> scroll.fullScroll(
                                  View.FOCUS_DOWN
                              )
                          );
                      }
                  );

                  setContentView(root);
              }

              private void addMessage(
                      LinearLayout parent,
                      String message
              ) {

                  TextView bubble =
                      text(
                          message +
                          "\n\n✓ Okundu • " +
                          "60 saniye",
                          15
                      );

                  bubble.setTextColor(
                      Color.WHITE
                  );

                  bubble.setPadding(
                      dp(14),
                      dp(10),
                      dp(14),
                      dp(10)
                  );

                  bubble.setBackgroundColor(
                      Color.rgb(
                          0,
                          80,
                          105
                      )
                  );

                  parent.addView(
                      bubble,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(85)
                      )
                  );

                  handler.postDelayed(
                      () -> {

                          if (
                              bubble.getParent()
                                  != null
                          ) {

                              (
                                  (LinearLayout)
                                  bubble.getParent()
                              )
                              .removeView(
                                  bubble
                              );
                          }

                      },
                      60000
                  );
              }
          }
          EOF

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-IDENTITY-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk