name: NEXUS Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1 — CHECKOUT
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # 2 — JAVA 21
      # ==================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ==================================================
      # 3 — ANDROID SDK
      # ==================================================
      - name: Check Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==================================================
      # 4 — GRADLE 9.5 WRAPPER
      # ==================================================
      - name: Prepare Gradle wrapper
        run: |
          mkdir -p gradle/wrapper

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = "NEXUS"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
          }
          EOF

          gradle wrapper --gradle-version 9.5

          chmod +x gradlew

          ./gradlew --version

      # ==================================================
      # 5 — PROJECT
      # ==================================================
      - name: Create NEXUS project
        run: |
          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/nexus/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()

                  maven {
                      name = "SignalBuildArtifacts"
                      url = uri(
                          "https://build-artifacts.signal.org/libraries/maven/"
                      )
                  }
              }
          }

          rootProject.name = "NEXUS"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.nexus.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.nexus.app'

                  minSdk 26

                  targetSdk 35

                  versionCode 9

                  versionName '0.9.0-signal'

                  testInstrumentationRunner \
                      'androidx.test.runner.AndroidJUnitRunner'
              }

              compileOptions {

                  coreLibraryDesugaringEnabled true

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {

                  release {
                      minifyEnabled false
                  }

                  debug {
                      minifyEnabled false
                  }
              }

              packaging {

                  resources {

                      excludes += [
                          "libsignal_jni*.dylib",
                          "signal_jni*.dll"
                      ]
                  }
              }
          }

          dependencies {

              implementation \
                  'androidx.appcompat:appcompat:1.7.0'

              implementation \
                  'androidx.core:core:1.15.0'

              implementation \
                  'com.squareup.okhttp3:okhttp:4.12.0'

              /*
               * Signal Protocol
               *
               * libsignal-client:
               * platform-independent Signal implementation
               *
               * libsignal-android:
               * Android native libraries
               */
              implementation \
                  'org.signal:libsignal-client:0.102.2'

              implementation \
                  'org.signal:libsignal-android:0.102.2'

              coreLibraryDesugaring \
                  'com.android.tools:desugar_jdk_libs:2.1.5'

              testImplementation \
                  'junit:junit:4.13.2'
          }
          EOF

      # ==================================================
      # 6 — MANIFEST
      # ==================================================
      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="NEXUS"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ==================================================
      # 7 — THEME
      # ==================================================
      - name: Create theme
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

              </style>

          </resources>
          EOF

      # ==================================================
      # 8 — ANDROID KEYSTORE IDENTITY
      # ==================================================
      - name: Create IdentityStore
        run: |
          cat > app/src/main/java/com/nexus/app/IdentityStore.java <<'EOF'
          package com.nexus.app;

          import java.security.KeyPair;
          import java.security.KeyPairGenerator;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.spec.ECGenParameterSpec;

          public final class IdentityStore {

              private static final String ALIAS =
                      "nexus_device_identity_v1";

              private IdentityStore() {}

              public static KeyPair getOrCreateIdentity()
                      throws Exception {

                  KeyStore keyStore =
                          KeyStore.getInstance(
                                  "AndroidKeyStore"
                          );

                  keyStore.load(null);

                  if (keyStore.containsAlias(ALIAS)) {

                      KeyStore.PrivateKeyEntry entry =
                              (KeyStore.PrivateKeyEntry)
                                      keyStore.getEntry(
                                              ALIAS,
                                              null
                                      );

                      return new KeyPair(
                              entry.getCertificate()
                                      .getPublicKey(),
                              entry.getPrivateKey()
                      );
                  }

                  KeyPairGenerator generator =
                          KeyPairGenerator.getInstance(
                                  "EC",
                                  "AndroidKeyStore"
                          );

                  generator.initialize(
                          new ECGenParameterSpec(
                                  "secp256r1"
                          )
                  );

                  return generator.generateKeyPair();
              }

              public static String fingerprint()
                      throws Exception {

                  KeyPair pair =
                          getOrCreateIdentity();

                  MessageDigest digest =
                          MessageDigest.getInstance(
                                  "SHA-256"
                          );

                  byte[] hash =
                          digest.digest(
                                  pair.getPublic()
                                      .getEncoded()
                          );

                  StringBuilder result =
                          new StringBuilder();

                  for (byte b : hash) {

                      result.append(
                              String.format(
                                      "%02X",
                                      b
                              )
                      );
                  }

                  return result.substring(
                          0,
                          32
                  );
              }
          }
          EOF

      # ==================================================
      # 9 — SIGNAL VERSION / INTEGRATION BOUNDARY
      # ==================================================
      - name: Create SignalEngine
        run: |
          cat > app/src/main/java/com/nexus/app/SignalEngine.java <<'EOF'
          package com.nexus.app;

          /**
           * NEXUS Signal integration boundary.
           *
           * IMPORTANT:
           *
           * This class intentionally does NOT implement
           * cryptography itself.
           *
           * The actual session implementation will use
           * libsignal rather than custom cryptography.
           */
          public final class SignalEngine {

              public static final String LIBSIGNAL_VERSION =
                      "0.102.2";

              public static final String PROTOCOL =
                      "Signal Protocol / Double Ratchet";

              private SignalEngine() {}

              public static String status() {

                  return
                      "libsignal " +
                      LIBSIGNAL_VERSION +
                      " hazır.\n" +
                      "Gerçek session katmanı " +
                      "sonraki aşamada.";
              }
          }
          EOF

      # ==================================================
      # 10 — RELAY ENVELOPE
      # ==================================================
      - name: Create RelayEnvelope
        run: |
          cat > app/src/main/java/com/nexus/app/RelayEnvelope.java <<'EOF'
          package com.nexus.app;

          import android.util.Base64;

          import java.nio.charset.StandardCharsets;
          import java.util.UUID;

          public final class RelayEnvelope {

              public final String messageId;

              public final String sender;

              public final String recipient;

              public final long timestamp;

              public final long expiresAt;

              public final String ciphertext;

              public RelayEnvelope(
                      String sender,
                      String recipient,
                      String ciphertext) {

                  this.messageId =
                          UUID.randomUUID().toString();

                  this.sender = sender;

                  this.recipient = recipient;

                  this.timestamp =
                          System.currentTimeMillis();

                  this.expiresAt =
                          timestamp + 60_000L;

                  this.ciphertext =
                          ciphertext;
              }

              public String serialize() {

                  String raw =
                          messageId + "|" +
                          sender + "|" +
                          recipient + "|" +
                          timestamp + "|" +
                          expiresAt + "|" +
                          ciphertext;

                  return Base64.encodeToString(
                          raw.getBytes(
                                  StandardCharsets.UTF_8
                          ),
                          Base64.NO_WRAP
                  );
              }
          }
          EOF

      # ==================================================
      # 11 — REPLAY GUARD
      # ==================================================
      - name: Create ReplayGuard
        run: |
          cat > app/src/main/java/com/nexus/app/ReplayGuard.java <<'EOF'
          package com.nexus.app;

          import java.util.LinkedHashMap;
          import java.util.Map;

          public final class ReplayGuard {

              private static final int MAX_ENTRIES =
                      2048;

              private final Map<String, Boolean> seen =
                      new LinkedHashMap<String, Boolean>(
                              256,
                              0.75f,
                              true) {

                          @Override
                          protected boolean
                          removeEldestEntry(
                                  Map.Entry<String, Boolean>
                                          eldest) {

                              return size() >
                                      MAX_ENTRIES;
                          }
                      };

              public synchronized boolean accept(
                      String messageId) {

                  if (messageId == null ||
                          messageId.isEmpty()) {

                      return false;
                  }

                  if (seen.containsKey(messageId)) {

                      return false;
                  }

                  seen.put(
                          messageId,
                          Boolean.TRUE
                  );

                  return true;
              }
          }
          EOF

      # ==================================================
      # 12 — MAIN ACTIVITY
      # ==================================================
      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/nexus/app/MainActivity.java <<'EOF'
          package com.nexus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity
                  extends Activity {

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(
                          savedInstanceState
                  );

                  /*
                   * Prevent screenshots and
                   * screen recording.
                   */
                  getWindow().setFlags(
                          WindowManager.LayoutParams
                                  .FLAG_SECURE,
                          WindowManager.LayoutParams
                                  .FLAG_SECURE
                  );

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          40,
                          50,
                          40,
                          40
                  );

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "NEXUS\n" +
                          "0.9.0 • SIGNAL"
                  );

                  title.setTextSize(30);

                  root.addView(title);

                  TextView fingerprint =
                          new TextView(this);

                  try {

                      fingerprint.setText(
                              "\nDevice fingerprint:\n" +
                              IdentityStore.fingerprint()
                      );

                  } catch (Exception e) {

                      fingerprint.setText(
                              "\nFingerprint unavailable"
                      );
                  }

                  fingerprint.setTextSize(
                          17
                  );

                  root.addView(
                          fingerprint
                  );

                  TextView signal =
                          new TextView(this);

                  signal.setText(
                          "\n\nSignal layer:\n" +
                          SignalEngine.status() +
                          "\n\n" +
                          "✓ libsignal dependency" +
                          "\n" +
                          "✓ Android Keystore" +
                          "\n" +
                          "✓ Double Ratchet library" +
                          "\n" +
                          "✓ Replay protection" +
                          "\n\n" +
                          "Gerçek mesaj " +
                          "şifreleme henüz aktif değil."
                  );

                  signal.setTextSize(
                          16
                  );

                  root.addView(
                          signal
                  );

                  setContentView(root);
              }
          }
          EOF

      # ==================================================
      # 13 — TESTS
      # ==================================================
      - name: Create tests
        run: |
          cat > app/src/test/java/com/nexus/app/SignalEngineTest.java <<'EOF'
          package com.nexus.app;

          import org.junit.Test;

          import static org.junit.Assert.assertEquals;
          import static org.junit.Assert.assertTrue;

          public class SignalEngineTest {

              @Test
              public void signalVersion() {

                  assertEquals(
                          "0.102.2",
                          SignalEngine.LIBSIGNAL_VERSION
                  );
              }

              @Test
              public void protocolContainsDoubleRatchet() {

                  assertTrue(
                          SignalEngine.PROTOCOL
                                  .contains(
                                          "Double Ratchet"
                                  )
                  );
              }
          }
          EOF

          cat > app/src/test/java/com/nexus/app/ReplayGuardTest.java <<'EOF'
          package com.nexus.app;

          import org.junit.Test;

          import static org.junit.Assert.assertFalse;
          import static org.junit.Assert.assertTrue;

          public class ReplayGuardTest {

              @Test
              public void duplicateIsRejected() {

                  ReplayGuard guard =
                          new ReplayGuard();

                  assertTrue(
                          guard.accept("message-1")
                  );

                  assertFalse(
                          guard.accept("message-1")
                  );
              }

              @Test
              public void differentMessagesAccepted() {

                  ReplayGuard guard =
                          new ReplayGuard();

                  assertTrue(
                          guard.accept("message-1")
                  );

                  assertTrue(
                          guard.accept("message-2")
                  );
              }
          }
          EOF

      # ==================================================
      # 14 — TEST
      # ==================================================
      - name: Run unit tests
        run: |
          ./gradlew test

      # ==================================================
      # 15 — BUILD
      # ==================================================
      - name: Build debug APK
        run: |
          ./gradlew assembleDebug

      # ==================================================
      # 16 — VERIFY
      # ==================================================
      - name: Verify APK
        run: |
          ls -lh \
            app/build/outputs/apk/debug/

          sha256sum \
            app/build/outputs/apk/debug/app-debug.apk

      # ==================================================
      # 17 — ARTIFACT
      # ==================================================
      - name: Upload NEXUS 0.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-SIGNAL-0.9-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14