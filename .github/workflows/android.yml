name: NEXUS Android E2EE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Create NEXUS project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      name = "SignalBuildArtifacts"
                      url = uri("https://build-artifacts.signal.org/libraries/maven/")
                  }
              }
          }

          rootProject.name = "NEXUS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexus.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexus.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 7
                  versionName '0.7.0-network'
              }

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += [
                          "libsignal_jni*.dylib",
                          "signal_jni*.dll"
                      ]
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
              implementation 'org.signal:libsignal-client:0.102.2'
              implementation 'org.signal:libsignal-android:0.102.2'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="NEXUS"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00C2FF</item>
                  <item name="android:statusBarColor">#080A0F</item>
                  <item name="android:navigationBarColor">#080A0F</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/nexus/app/MainActivity.java <<'EOF'
          package com.nexus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Handler;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.security.KeyPairGenerator;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.spec.ECGenParameterSpec;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private static final String KEY_ALIAS =
                      "nexus_device_identity_v1";

              private final Handler handler =
                      new Handler();

              private SharedPreferences prefs;

              private final int BG =
                      Color.rgb(8, 10, 15);

              private final int CARD =
                      Color.rgb(20, 24, 32);

              private int dp(int v) {
                  return (int)(
                      v *
                      getResources()
                          .getDisplayMetrics()
                          .density + 0.5f
                  );
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  prefs = getSharedPreferences(
                      "nexus_user",
                      Context.MODE_PRIVATE
                  );

                  if (prefs.getBoolean(
                          "registered",
                          false)) {
                      showHome();
                  } else {
                      showWelcome();
                  }
              }

              private TextView text(
                      String s,
                      float size) {

                  TextView t =
                      new TextView(this);

                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);

                  return t;
              }

              private Button button(String s) {

                  Button b =
                      new Button(this);

                  b.setText(s);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(16);
                  b.setAllCaps(false);
                  b.setBackgroundColor(CARD);

                  return b;
              }

              private LinearLayout page(
                      String title) {

                  LinearLayout root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setPadding(
                      dp(20),
                      dp(30),
                      dp(20),
                      dp(20)
                  );

                  root.setBackgroundColor(BG);

                  TextView t =
                      text(title, 28);

                  t.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD
                  );

                  root.addView(
                      t,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(60)
                      )
                  );

                  return root;
              }

              private String ensureFingerprint() {

                  try {

                      KeyStore ks =
                          KeyStore.getInstance(
                              "AndroidKeyStore"
                          );

                      ks.load(null);

                      if (!ks.containsAlias(
                              KEY_ALIAS)) {

                          KeyPairGenerator gen =
                              KeyPairGenerator.getInstance(
                                  KeyProperties
                                      .KEY_ALGORITHM_EC,
                                  "AndroidKeyStore"
                              );

                          gen.initialize(
                              new KeyGenParameterSpec.Builder(
                                  KEY_ALIAS,
                                  KeyProperties.PURPOSE_SIGN |
                                  KeyProperties.PURPOSE_VERIFY
                              )
                              .setAlgorithmParameterSpec(
                                  new ECGenParameterSpec(
                                      "secp256r1"
                                  )
                              )
                              .setDigests(
                                  KeyProperties.DIGEST_SHA256
                              )
                              .build()
                          );

                          gen.generateKeyPair();
                      }

                      byte[] publicKey =
                          ks.getCertificate(
                              KEY_ALIAS
                          )
                          .getPublicKey()
                          .getEncoded();

                      byte[] hash =
                          MessageDigest
                              .getInstance("SHA-256")
                              .digest(publicKey);

                      StringBuilder out =
                          new StringBuilder();

                      for (byte b : hash) {
                          out.append(
                              String.format(
                                  "%02X",
                                  b
                              )
                          );
                      }

                      return out
                          .toString()
                          .substring(0, 32);

                  } catch (Exception e) {

                      return "KEYSTORE-ERROR";
                  }
              }

              private String createId() {

                  String raw =
                      UUID.randomUUID()
                          .toString()
                          .replace("-", "")
                          .toUpperCase();

                  return "NX-" +
                      raw.substring(0, 4) +
                      "-" +
                      raw.substring(4, 8) +
                      "-" +
                      raw.substring(8, 12);
              }

              private void showWelcome() {

                  LinearLayout root =
                      page("NEXUS");

                  TextView info =
                      text(
                          "Güvenli NEXUS kimliğini " +
                          "oluşturalım.",
                          17
                      );

                  info.setTextColor(
                      Color.LTGRAY
                  );

                  root.addView(info);

                  EditText name =
                      new EditText(this);

                  name.setHint(
                      "Kullanıcı adı"
                  );

                  name.setHintTextColor(
                      Color.GRAY
                  );

                  name.setTextColor(
                      Color.WHITE
                  );

                  root.addView(
                      name,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(65)
                      )
                  );

                  Button create =
                      button(
                          "Kimlik oluştur"
                      );

                  LinearLayout.LayoutParams cp =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(65)
                      );

                  cp.topMargin = dp(20);

                  root.addView(create, cp);

                  create.setOnClickListener(v -> {

                      String username =
                          name.getText()
                              .toString()
                              .trim();

                      if (username.length() < 3) {
                          return;
                      }

                      String id =
                          createId();

                      String fp =
                          ensureFingerprint();

                      prefs.edit()
                          .putBoolean(
                              "registered",
                              true
                          )
                          .putString(
                              "username",
                              username
                          )
                          .putString(
                              "nexus_id",
                              id
                          )
                          .putString(
                              "fingerprint",
                              fp
                          )
                          .apply();

                      showIdentity();
                  });

                  setContentView(root);
              }

              private void showIdentity() {

                  LinearLayout root =
                      page("NEXUS Kimliği");

                  String id =
                      prefs.getString(
                          "nexus_id",
                          "NX-UNKNOWN"
                      );

                  String fp =
                      prefs.getString(
                          "fingerprint",
                          ensureFingerprint()
                      );

                  root.addView(
                      text(
                          "NEXUS ID\n\n" +
                          id +
                          "\n\nCihaz fingerprint\n\n" +
                          fp +
                          "\n\n" +
                          "Özel anahtar cihazdan " +
                          "çıkarılmaz.",
                          16
                      )
                  );

                  Button next =
                      button(
                          "Devam"
                      );

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(60)
                      );

                  p.topMargin = dp(25);

                  root.addView(next, p);

                  next.setOnClickListener(
                      v -> showHome()
                  );

                  setContentView(root);
              }

              private void showHome() {

                  LinearLayout root =
                      page("NEXUS");

                  String username =
                      prefs.getString(
                          "username",
                          "Kullanıcı"
                      );

                  String id =
                      prefs.getString(
                          "nexus_id",
                          "NX-UNKNOWN"
                      );

                  root.addView(
                      text(
                          username +
                          "\n" +
                          id,
                          15
                      )
                  );

                  TextView status =
                      text(
                          "\n● Güvenli bağlantı altyapısı " +
                          "hazır\n\n" +
                          "Sunucu: henüz bağlanmadı\n" +
                          "E2EE oturumu: bekleniyor\n" +
                          "Relay: bekleniyor",
                          14
                      );

                  status.setTextColor(
                      Color.LTGRAY
                  );

                  root.addView(status);

                  Button newChat =
                      button(
                          "+ Yeni sohbet"
                      );

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(60)
                      );

                  p.topMargin = dp(25);

                  root.addView(newChat, p);

                  newChat.setOnClickListener(
                      v -> showNewChat()
                  );

                  setContentView(root);
              }

              private void showNewChat() {

                  LinearLayout root =
                      page("Yeni sohbet");

                  EditText target =
                      new EditText(this);

                  target.setHint(
                      "Karşı tarafın NEXUS ID'si"
                  );

                  target.setHintTextColor(
                      Color.GRAY
                  );

                  target.setTextColor(
                      Color.WHITE
                  );

                  root.addView(
                      target,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(65)
                      )
                  );

                  Button connect =
                      button(
                          "Güvenli bağlantı başlat"
                      );

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(65)
                      );

                  p.topMargin = dp(15);

                  root.addView(connect, p);

                  TextView result =
                      text("", 14);

                  result.setTextColor(
                      Color.LTGRAY
                  );

                  root.addView(result);

                  connect.setOnClickListener(
                      v -> {

                          String id =
                              target.getText()
                                  .toString()
                                  .trim();

                          if (!id.startsWith(
                                  "NX-")) {

                              result.setText(
                                  "Geçerli bir NEXUS ID gir."
                              );

                              return;
                          }

                          result.setText(
                              "Bağlantı isteği hazırlandı.\n\n" +
                              "Relay sunucusu henüz " +
                              "bağlı olmadığı için bu " +
                              "aşamada gerçek ağ bağlantısı " +
                              "kurulmadı."
                          );
                      }
                  );

                  setContentView(root);
              }
          }
          EOF

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-NETWORK-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk