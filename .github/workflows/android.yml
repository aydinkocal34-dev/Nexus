name: NEXUS Android 0.8 Relay

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          ls -la "$ANDROID_HOME"
          sdkmanager --version

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create NEXUS 0.8 project
        shell: bash
        run: |
          rm -rf app

          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/nexus/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url = uri("https://build-artifacts.signal.org/libraries/maven/")
                  }
              }
          }

          rootProject.name = "NEXUS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexus.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexus.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 8
                  versionName '0.8.0-relay'
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += [
                          "META-INF/DEPENDENCIES",
                          "META-INF/LICENSE",
                          "META-INF/LICENSE.txt",
                          "META-INF/NOTICE",
                          "META-INF/NOTICE.txt"
                      ]
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.1'
              implementation 'androidx.core:core:1.17.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'

              implementation 'org.signal:libsignal-client:0.102.2'
              implementation 'org.signal:libsignal-android:0.102.2'

              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

              testImplementation 'junit:junit:4.13.2'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:label="NEXUS"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080808</item>
                  <item name="android:navigationBarColor">#080808</item>
                  <item name="android:colorAccent">#00E5FF</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/nexus/app/MainActivity.java <<'EOF'
          package com.nexus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.widget.*;

          public class MainActivity extends Activity {

              private TextView status;
              private RelayClient relay;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  buildUi();

                  relay = new RelayClient(
                      "wss://relay.nexus.local/ws",
                      this::updateStatus
                  );
              }

              private TextView text(String value, int size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(24, 14, 24, 14);
                  return t;
              }

              private void buildUi() {

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(8, 8, 8));
                  root.setPadding(20, 20, 20, 20);

                  TextView title = text("NEXUS", 30);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);

                  TextView version =
                      text("0.8.0 • RELAY", 13);
                  version.setGravity(Gravity.CENTER);
                  version.setTextColor(Color.LTGRAY);

                  TextView identity = text(
                      "NEXUS ID: "
                      + IdentityStore.getNexusId(this)
                      + "\nFingerprint: "
                      + IdentityStore.getFingerprint(this),
                      13
                  );

                  status = text(
                      "● RELAY: BAĞLI DEĞİL",
                      16
                  );

                  Button connect = new Button(this);
                  connect.setText(
                      "GÜVENLİ BAĞLANTIYI BAŞLAT"
                  );

                  connect.setOnClickListener(v -> {
                      updateStatus(
                          "● RELAY: BAĞLANIYOR..."
                      );
                      relay.connect();
                  });

                  Button disconnect = new Button(this);
                  disconnect.setText("BAĞLANTIYI KES");

                  disconnect.setOnClickListener(v -> {
                      relay.disconnect();
                      updateStatus(
                          "● RELAY: BAĞLI DEĞİL"
                      );
                  });

                  TextView info = text(
                      "BLIND RELAY\n\n"
                      + "Relay mesaj içeriğini okuyamaz.\n\n"
                      + "Bu sürüm ağ taşıma katmanını hazırlar.\n\n"
                      + "Gerçek Signal E2EE oturumu "
                      + "bir sonraki aşamada kurulacaktır.\n\n"
                      + "TLS/WSS • Replay Protection\n"
                      + "Message ID • Reconnect",
                      14
                  );

                  root.addView(title);
                  root.addView(version);
                  root.addView(identity);
                  root.addView(status);
                  root.addView(connect);
                  root.addView(disconnect);
                  root.addView(info);

                  setContentView(root);
              }

              private void updateStatus(String value) {
                  runOnUiThread(
                      () -> status.setText(value)
                  );
              }
          }
          EOF

          cat > app/src/main/java/com/nexus/app/IdentityStore.java <<'EOF'
          package com.nexus.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;

          import java.security.KeyPairGenerator;
          import java.security.KeyStore;
          import java.security.MessageDigest;

          public final class IdentityStore {

              private static final String ALIAS =
                  "nexus_device_identity_v1";

              private static final String PREF =
                  "nexus_identity";

              private IdentityStore() {}

              public static String getNexusId(Context context) {

                  SharedPreferences p =
                      context.getSharedPreferences(
                          PREF,
                          Context.MODE_PRIVATE
                      );

                  String id =
                      p.getString("nexus_id", null);

                  if (id == null) {
                      id =
                          "NX-"
                          + randomPart()
                          + "-"
                          + randomPart()
                          + "-"
                          + randomPart();

                      p.edit()
                          .putString("nexus_id", id)
                          .apply();
                  }

                  ensureKey();

                  return id;
              }

              public static String getFingerprint(Context context) {

                  getNexusId(context);

                  try {
                      KeyStore ks =
                          KeyStore.getInstance("AndroidKeyStore");

                      ks.load(null);

                      byte[] encoded =
                          ks.getCertificate(ALIAS)
                            .getPublicKey()
                            .getEncoded();

                      byte[] digest =
                          MessageDigest
                              .getInstance("SHA-256")
                              .digest(encoded);

                      StringBuilder sb =
                          new StringBuilder();

                      for (byte b : digest) {
                          sb.append(
                              String.format("%02X", b)
                          );
                      }

                      return sb.substring(0, 32);

                  } catch (Exception e) {
                      return "UNAVAILABLE";
                  }
              }

              private static void ensureKey() {

                  try {
                      KeyStore ks =
                          KeyStore.getInstance("AndroidKeyStore");

                      ks.load(null);

                      if (ks.containsAlias(ALIAS)) {
                          return;
                      }

                      KeyPairGenerator generator =
                          KeyPairGenerator.getInstance(
                              KeyProperties.KEY_ALGORITHM_EC,
                              "AndroidKeyStore"
                          );

                      KeyGenParameterSpec spec =
                          new KeyGenParameterSpec.Builder(
                              ALIAS,
                              KeyProperties.PURPOSE_SIGN
                                  | KeyProperties.PURPOSE_VERIFY
                          )
                          .setAlgorithmParameterSpec(
                              new java.security.spec
                                  .ECGenParameterSpec(
                                      "secp256r1"
                                  )
                          )
                          .setDigests(
                              KeyProperties.DIGEST_SHA256
                          )
                          .build();

                      generator.initialize(spec);
                      generator.generateKeyPair();

                  } catch (Exception ignored) {
                  }
              }

              private static String randomPart() {
                  return String.format(
                      "%04X",
                      (int)(Math.random() * 65536)
                  );
              }
          }
          EOF

          cat > app/src/main/java/com/nexus/app/RelayEnvelope.java <<'EOF'
          package com.nexus.app;

          import java.nio.charset.StandardCharsets;
          import java.util.Base64;
          import java.util.UUID;

          public final class RelayEnvelope {

              public final String messageId;
              public final String sender;
              public final String recipient;
              public final long timestamp;
              public final long expiration;
              public final String ciphertext;

              public RelayEnvelope(
                  String sender,
                  String recipient,
                  String ciphertext,
                  long expiration
              ) {
                  this.messageId =
                      UUID.randomUUID().toString();
                  this.sender = sender;
                  this.recipient = recipient;
                  this.timestamp =
                      System.currentTimeMillis();
                  this.expiration = expiration;
                  this.ciphertext = ciphertext;
              }

              public String serialize() {

                  String raw =
                      messageId + "|"
                      + sender + "|"
                      + recipient + "|"
                      + timestamp + "|"
                      + expiration + "|"
                      + ciphertext;

                  return Base64.getEncoder()
                      .encodeToString(
                          raw.getBytes(
                              StandardCharsets.UTF_8
                          )
                      );
              }

              public static String opaqueCiphertext(
                  byte[] encryptedData
              ) {
                  return Base64.getEncoder()
                      .encodeToString(encryptedData);
              }
          }
          EOF

          cat > app/src/main/java/com/nexus/app/ReplayGuard.java <<'EOF'
          package com.nexus.app;

          import java.util.Collections;
          import java.util.LinkedHashMap;
          import java.util.Map;

          public final class ReplayGuard {

              private static final int MAX_ENTRIES = 2048;

              private final Map<String, Boolean> seen =
                  Collections.synchronizedMap(
                      new LinkedHashMap<String, Boolean>(
                          MAX_ENTRIES,
                          0.75f,
                          true
                      ) {
                          @Override
                          protected boolean removeEldestEntry(
                              Map.Entry<String, Boolean> eldest
                          ) {
                              return size() > MAX_ENTRIES;
                          }
                      }
                  );

              public boolean accept(String messageId) {

                  if (
                      messageId == null
                      || messageId.isEmpty()
                  ) {
                      return false;
                  }

                  synchronized (seen) {

                      if (seen.containsKey(messageId)) {
                          return false;
                      }

                      seen.put(
                          messageId,
                          Boolean.TRUE
                      );

                      return true;
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/nexus/app/RelayClient.java <<'EOF'
          package com.nexus.app;

          import java.util.concurrent.TimeUnit;

          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;

          public final class RelayClient {

              public interface Listener {
                  void onStatus(String status);
              }

              private final String url;
              private final Listener listener;

              private final OkHttpClient client;

              private WebSocket socket;

              private int reconnectAttempt = 0;

              private boolean manuallyClosed = false;

              private final ReplayGuard replayGuard =
                  new ReplayGuard();

              public RelayClient(
                  String url,
                  Listener listener
              ) {
                  this.url = url;
                  this.listener = listener;

                  client =
                      new OkHttpClient.Builder()
                          .connectTimeout(
                              10,
                              TimeUnit.SECONDS
                          )
                          .readTimeout(
                              0,
                              TimeUnit.MILLISECONDS
                          )
                          .pingInterval(
                              20,
                              TimeUnit.SECONDS
                          )
                          .build();
              }

              public void connect() {

                  manuallyClosed = false;

                  Request request =
                      new Request.Builder()
                          .url(url)
                          .build();

                  socket =
                      client.newWebSocket(
                          request,
                          new WebSocketListener() {

                              @Override
                              public void onOpen(
                                  WebSocket webSocket,
                                  Response response
                              ) {
                                  reconnectAttempt = 0;

                                  listener.onStatus(
                                      "● RELAY: BAĞLI"
                                  );
                              }

                              @Override
                              public void onMessage(
                                  WebSocket webSocket,
                                  String text
                              ) {
                                  listener.onStatus(
                                      "● RELAY: ŞİFRELİ VERİ ALINDI"
                                  );
                              }

                              @Override
                              public void onClosing(
                                  WebSocket webSocket,
                                  int code,
                                  String reason
                              ) {
                                  listener.onStatus(
                                      "● RELAY: KAPANIYOR"
                                  );
                              }

                              @Override
                              public void onClosed(
                                  WebSocket webSocket,
                                  int code,
                                  String reason
                              ) {
                                  listener.onStatus(
                                      "● RELAY: BAĞLANTI KESİLDİ"
                                  );

                                  scheduleReconnect();
                              }

                              @Override
                              public void onFailure(
                                  WebSocket webSocket,
                                  Throwable t,
                                  Response response
                              ) {
                                  listener.onStatus(
                                      "● RELAY: BAĞLANTI BAŞARISIZ"
                                  );

                                  scheduleReconnect();
                              }
                          }
                      );
              }

              private void scheduleReconnect() {

                  if (manuallyClosed) {
                      return;
                  }

                  reconnectAttempt++;

                  long delay =
                      Math.min(
                          30000L,
                          1000L * (
                              1L << Math.min(
                                  reconnectAttempt - 1,
                                  5
                              )
                          )
                      );

                  new android.os.Handler(
                      android.os.Looper.getMainLooper()
                  ).postDelayed(
                      this::connect,
                      delay
                  );
              }

              public boolean send(
                  RelayEnvelope envelope
              ) {
                  if (socket == null) {
                      return false;
                  }

                  return socket.send(
                      envelope.serialize()
                  );
              }

              public boolean acceptMessage(
                  String messageId
              ) {
                  return replayGuard.accept(
                      messageId
                  );
              }

              public void disconnect() {

                  manuallyClosed = true;

                  if (socket != null) {

                      socket.close(
                          1000,
                          "NEXUS user disconnect"
                      );

                      socket = null;
                  }
              }
          }
          EOF

          cat > app/src/test/java/com/nexus/app/RelayEnvelopeTest.java <<'EOF'
          package com.nexus.app;

          import org.junit.Test;

          import static org.junit.Assert.*;

          public class RelayEnvelopeTest {

              @Test
              public void envelopeHasUniqueMessageId() {

                  RelayEnvelope a =
                      new RelayEnvelope(
                          "NX-A",
                          "NX-B",
                          "OPAQUE-A",
                          System.currentTimeMillis()
                              + 60000
                      );

                  RelayEnvelope b =
                      new RelayEnvelope(
                          "NX-A",
                          "NX-B",
                          "OPAQUE-B",
                          System.currentTimeMillis()
                              + 60000
                      );

                  assertNotEquals(
                      a.messageId,
                      b.messageId
                  );
              }
          }
          EOF

          cat > app/src/test/java/com/nexus/app/ReplayGuardTest.java <<'EOF'
          package com.nexus.app;

          import org.junit.Test;

          import static org.junit.Assert.*;

          public class ReplayGuardTest {

              @Test
              public void duplicateMessageIsRejected() {

                  ReplayGuard guard =
                      new ReplayGuard();

                  assertTrue(
                      guard.accept("message-001")
                  );

                  assertFalse(
                      guard.accept("message-001")
                  );
              }

              @Test
              public void differentMessagesAreAccepted() {

                  ReplayGuard guard =
                      new ReplayGuard();

                  assertTrue(
                      guard.accept("message-001")
                  );

                  assertTrue(
                      guard.accept("message-002")
                  );
              }
          }
          EOF

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.13

      - name: Run unit tests
        run: |
          ./gradlew test --no-daemon --stacktrace

      - name: Build NEXUS 0.8
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload NEXUS 0.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-RELAY-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14