name: NEXUS Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. KODU AL
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. JAVA 21
      # --------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --------------------------------------------------
      # 3. ANDROID SDK
      # --------------------------------------------------
      - name: Check Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 4. GRADLE 9.5 WRAPPER'I ÖNCE OLUŞTUR
      #
      # ÖNEMLİ:
      # Android projesini oluşturmadan önce yapıyoruz.
      # Böylece sistem Gradle 9.8'in AGP'yi yükleyip
      # wrapper oluşturma aşamasında patlamasını engelliyoruz.
      # --------------------------------------------------
      - name: Prepare Gradle wrapper
        run: |
          mkdir -p gradle/wrapper

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = "NEXUS"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              // Android plugin project oluşturulduktan sonra
              // app modülünde kullanılacak.
          }
          EOF

          gradle wrapper --gradle-version 9.5

          chmod +x gradlew

          ./gradlew --version

      # --------------------------------------------------
      # 5. NEXUS 0.8 PROJESİNİ OLUŞTUR
      # --------------------------------------------------
      - name: Create NEXUS 0.8 project
        run: |
          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/nexus/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url = uri("https://build-artifacts.signal.org/libraries/maven/")
                  }
              }
          }

          rootProject.name = "NEXUS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexus.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexus.app'
                  minSdk 26
                  targetSdk 35

                  versionCode 8
                  versionName '0.8.0-relay'

                  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
              }

              compileOptions {
                  coreLibraryDesugaringEnabled true

                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }

                  debug {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.15.0'

              implementation 'com.squareup.okhttp3:okhttp:4.12.0'

              implementation 'org.signal:libsignal-client:0.102.2'
              implementation 'org.signal:libsignal-android:0.102.2'

              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

              testImplementation 'junit:junit:4.13.2'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="NEXUS"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>

              </style>

          </resources>
          EOF

      # --------------------------------------------------
      # 6. IDENTITY STORE
      # --------------------------------------------------
      - name: Create IdentityStore
        run: |
          cat > app/src/main/java/com/nexus/app/IdentityStore.java <<'EOF'
          package com.nexus.app;

          import android.content.Context;

          import java.nio.charset.StandardCharsets;
          import java.security.KeyPair;
          import java.security.KeyPairGenerator;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.PublicKey;
          import java.security.spec.ECGenParameterSpec;

          public final class IdentityStore {

              private static final String KEY_ALIAS =
                      "nexus_device_identity_v1";

              private IdentityStore() {}

              public static KeyPair getOrCreateIdentity() throws Exception {

                  KeyStore keyStore = KeyStore.getInstance("AndroidKeyStore");
                  keyStore.load(null);

                  if (keyStore.containsAlias(KEY_ALIAS)) {

                      KeyStore.Entry entry =
                              keyStore.getEntry(KEY_ALIAS, null);

                      if (entry instanceof KeyStore.PrivateKeyEntry) {

                          KeyStore.PrivateKeyEntry privateEntry =
                                  (KeyStore.PrivateKeyEntry) entry;

                          return new KeyPair(
                                  privateEntry.getCertificate().getPublicKey(),
                                  privateEntry.getPrivateKey()
                          );
                      }
                  }

                  KeyPairGenerator generator =
                          KeyPairGenerator.getInstance(
                                  "EC",
                                  "AndroidKeyStore"
                          );

                  generator.initialize(
                          new ECGenParameterSpec("secp256r1")
                  );

                  return generator.generateKeyPair();
              }

              public static String fingerprint(PublicKey publicKey)
                      throws Exception {

                  MessageDigest digest =
                          MessageDigest.getInstance("SHA-256");

                  byte[] hash =
                          digest.digest(publicKey.getEncoded());

                  StringBuilder result =
                          new StringBuilder();

                  for (byte b : hash) {
                      result.append(
                              String.format("%02X", b)
                      );
                  }

                  return result
                          .substring(0, 32);
              }

              public static String getFingerprint(Context context)
                      throws Exception {

                  KeyPair pair =
                          getOrCreateIdentity();

                  return fingerprint(
                          pair.getPublic()
                  );
              }
          }
          EOF

      # --------------------------------------------------
      # 7. RELAY ENVELOPE
      # --------------------------------------------------
      - name: Create RelayEnvelope
        run: |
          cat > app/src/main/java/com/nexus/app/RelayEnvelope.java <<'EOF'
          package com.nexus.app;

          import android.util.Base64;

          import java.nio.charset.StandardCharsets;
          import java.util.UUID;

          public final class RelayEnvelope {

              public final String messageId;
              public final String sender;
              public final String recipient;
              public final long timestamp;
              public final long expiresAt;
              public final String ciphertext;

              public RelayEnvelope(
                      String sender,
                      String recipient,
                      String ciphertext
              ) {

                  this.messageId =
                          UUID.randomUUID().toString();

                  this.sender = sender;
                  this.recipient = recipient;

                  this.timestamp =
                          System.currentTimeMillis();

                  this.expiresAt =
                          timestamp + 60_000L;

                  this.ciphertext =
                          ciphertext;
              }

              public String serialize() {

                  String raw =
                          messageId + "|" +
                          sender + "|" +
                          recipient + "|" +
                          timestamp + "|" +
                          expiresAt + "|" +
                          ciphertext;

                  return Base64.encodeToString(
                          raw.getBytes(
                                  StandardCharsets.UTF_8
                          ),
                          Base64.NO_WRAP
                  );
              }
          }
          EOF

      # --------------------------------------------------
      # 8. REPLAY GUARD
      # --------------------------------------------------
      - name: Create ReplayGuard
        run: |
          cat > app/src/main/java/com/nexus/app/ReplayGuard.java <<'EOF'
          package com.nexus.app;

          import java.util.LinkedHashMap;
          import java.util.Map;

          public final class ReplayGuard {

              private static final int MAX_ENTRIES = 2048;

              private final Map<String, Boolean> seen =
                      new LinkedHashMap<String, Boolean>(
                              256,
                              0.75f,
                              true
                      ) {

                          @Override
                          protected boolean removeEldestEntry(
                                  Map.Entry<String, Boolean> eldest
                          ) {

                              return size() > MAX_ENTRIES;
                          }
                      };

              public synchronized boolean accept(
                      String messageId
              ) {

                  if (messageId == null ||
                          messageId.isEmpty()) {
                      return false;
                  }

                  if (seen.containsKey(messageId)) {
                      return false;
                  }

                  seen.put(messageId, Boolean.TRUE);

                  return true;
              }
          }
          EOF

      # --------------------------------------------------
      # 9. RELAY CLIENT
      # --------------------------------------------------
      - name: Create RelayClient
        run: |
          cat > app/src/main/java/com/nexus/app/RelayClient.java <<'EOF'
          package com.nexus.app;

          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;

          import java.util.concurrent.TimeUnit;

          public final class RelayClient {

              public interface Listener {

                  void onConnected();

                  void onDisconnected();

                  void onMessage(String text);

                  void onError(String message);
              }

              private final OkHttpClient client;

              private final ReplayGuard replayGuard =
                      new ReplayGuard();

              private final Listener listener;

              private WebSocket webSocket;

              private boolean connected = false;

              public RelayClient(Listener listener) {

                  this.listener = listener;

                  client =
                          new OkHttpClient.Builder()
                                  .connectTimeout(
                                          15,
                                          TimeUnit.SECONDS
                                  )
                                  .readTimeout(
                                          0,
                                          TimeUnit.MILLISECONDS
                                  )
                                  .build();
              }

              public void connect(String url) {

                  Request request =
                          new Request.Builder()
                                  .url(url)
                                  .build();

                  webSocket =
                          client.newWebSocket(
                                  request,
                                  new WebSocketListener() {

                                      @Override
                                      public void onOpen(
                                              WebSocket webSocket,
                                              okhttp3.Response response
                                      ) {

                                          connected = true;

                                          if (listener != null) {
                                              listener.onConnected();
                                          }
                                      }

                                      @Override
                                      public void onMessage(
                                              WebSocket webSocket,
                                              String text
                                      ) {

                                          if (listener != null) {
                                              listener.onMessage(text);
                                          }
                                      }

                                      @Override
                                      public void onClosing(
                                              WebSocket webSocket,
                                              int code,
                                              String reason
                                      ) {

                                          connected = false;

                                          webSocket.close(
                                                  code,
                                                  reason
                                          );

                                          if (listener != null) {
                                              listener.onDisconnected();
                                          }
                                      }

                                      @Override
                                      public void onFailure(
                                              WebSocket webSocket,
                                              Throwable t,
                                              okhttp3.Response response
                                      ) {

                                          connected = false;

                                          if (listener != null) {
                                              listener.onError(
                                                      t.getMessage() == null
                                                              ? "Relay error"
                                                              : t.getMessage()
                                              );
                                          }
                                      }
                                  }
                          );
              }

              public boolean send(
                      String payload
              ) {

                  if (!connected ||
                          webSocket == null) {
                      return false;
                  }

                  return webSocket.send(payload);
              }

              public void disconnect() {

                  if (webSocket != null) {

                      webSocket.close(
                              1000,
                              "NEXUS disconnect"
                      );

                      webSocket = null;
                  }

                  connected = false;
              }

              public boolean isConnected() {
                  return connected;
              }

              public boolean acceptMessage(
                      String messageId
              ) {

                  return replayGuard.accept(
                          messageId
                  );
              }
          }
          EOF

      # --------------------------------------------------
      # 10. MAIN ACTIVITY
      # --------------------------------------------------
      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/nexus/app/MainActivity.java <<'EOF'
          package com.nexus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private static final String RELAY_URL =
                      "wss://relay.nexus.local/ws";

              private TextView status;

              private RelayClient relayClient;

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE
                  );

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          40,
                          50,
                          40,
                          40
                  );

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "NEXUS"
                  );

                  title.setTextSize(34);

                  root.addView(title);

                  TextView version =
                          new TextView(this);

                  version.setText(
                          "0.8.0 • Relay Foundation"
                  );

                  version.setTextSize(16);

                  root.addView(version);

                  TextView identity =
                          new TextView(this);

                  try {

                      identity.setText(
                              "Fingerprint\n" +
                              IdentityStore.getFingerprint(
                                      this
                              )
                      );

                  } catch (Exception e) {

                      identity.setText(
                              "Fingerprint unavailable"
                      );
                  }

                  identity.setPadding(
                          0,
                          40,
                          0,
                          30
                  );

                  root.addView(identity);

                  status =
                          new TextView(this);

                  status.setText(
                          "Relay: bağlı değil"
                  );

                  status.setTextSize(18);

                  root.addView(status);

                  Button connect =
                          new Button(this);

                  connect.setText(
                          "Güvenli bağlantı başlat"
                  );

                  connect.setOnClickListener(
                          v -> connectRelay()
                  );

                  root.addView(connect);

                  Button disconnect =
                          new Button(this);

                  disconnect.setText(
                          "Bağlantıyı kes"
                  );

                  disconnect.setOnClickListener(
                          v -> {

                              if (relayClient != null) {
                                  relayClient.disconnect();
                              }

                              status.setText(
                                      "Relay: bağlı değil"
                              );
                          }
                  );

                  root.addView(disconnect);

                  TextView info =
                          new TextView(this);

                  info.setText(
                          "\nNEXUS güvenlik temeli:\n" +
                          "• Android Keystore kimlik anahtarı\n" +
                          "• Ekran görüntüsü engelleme\n" +
                          "• WebSocket relay katmanı\n" +
                          "• Replay koruması\n" +
                          "• Signal Protocol bağımlılıkları\n\n" +
                          "Gerçek relay sunucusu henüz bağlı değil."
                  );

                  info.setPadding(
                          0,
                          30,
                          0,
                          0
                  );

                  root.addView(info);

                  setContentView(root);
              }

              private void connectRelay() {

                  status.setText(
                          "Relay: bağlanıyor..."
                  );

                  relayClient =
                          new RelayClient(
                                  new RelayClient.Listener() {

                                      @Override
                                      public void onConnected() {

                                          runOnUiThread(() ->
                                                  status.setText(
                                                          "Relay: bağlı"
                                                  )
                                          );
                                      }

                                      @Override
                                      public void onDisconnected() {

                                          runOnUiThread(() ->
                                                  status.setText(
                                                          "Relay: bağlantı kesildi"
                                                  )
                                          );
                                      }

                                      @Override
                                      public void onMessage(
                                              String text
                                      ) {

                                          runOnUiThread(() ->
                                                  status.setText(
                                                          "Relay mesajı alındı"
                                                  )
                                          );
                                      }

                                      @Override
                                      public void onError(
                                              String message
                                      ) {

                                          runOnUiThread(() ->
                                                  status.setText(
                                                          "Relay: " +
                                                          message
                                                  )
                                          );
                                      }
                                  }
                          );

                  relayClient.connect(
                          RELAY_URL
                  );
              }
          }
          EOF

      # --------------------------------------------------
      # 11. UNIT TESTLER
      # --------------------------------------------------
      - name: Create tests
        run: |
          cat > app/src/test/java/com/nexus/app/RelayEnvelopeTest.java <<'EOF'
          package com.nexus.app;

          import org.junit.Test;

          import static org.junit.Assert.assertNotEquals;
          import static org.junit.Assert.assertTrue;

          public class RelayEnvelopeTest {

              @Test
              public void messageIdsAreUnique() {

                  RelayEnvelope a =
                          new RelayEnvelope(
                                  "alice",
                                  "bob",
                                  "cipher-a"
                          );

                  RelayEnvelope b =
                          new RelayEnvelope(
                                  "alice",
                                  "bob",
                                  "cipher-b"
                          );

                  assertNotEquals(
                          a.messageId,
                          b.messageId
                  );
              }

              @Test
              public void replayGuardRejectsDuplicate() {

                  ReplayGuard guard =
                          new ReplayGuard();

                  assertTrue(
                          guard.accept("message-1")
                  );

                  assertTrue(
                          !guard.accept("message-1")
                  );
              }

              @Test
              public void replayGuardAcceptsDifferentMessages() {

                  ReplayGuard guard =
                          new ReplayGuard();

                  assertTrue(
                          guard.accept("message-1")
                  );

                  assertTrue(
                          guard.accept("message-2")
                  );
              }
          }
          EOF

      # --------------------------------------------------
      # 12. UNIT TEST
      # --------------------------------------------------
      - name: Run unit tests
        run: |
          ./gradlew test

      # --------------------------------------------------
      # 13. DEBUG APK
      # --------------------------------------------------
      - name: Build debug APK
        run: |
          ./gradlew assembleDebug

      # --------------------------------------------------
      # 14. APK KONTROL
      # --------------------------------------------------
      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      # --------------------------------------------------
      # 15. APK ARTIFACT
      # --------------------------------------------------
      - name: Upload NEXUS APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-RELAY-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14