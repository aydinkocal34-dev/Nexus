name: NEXUS Android E2EE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Create NEXUS project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      name = "SignalBuildArtifacts"
                      url = uri("https://build-artifacts.signal.org/libraries/maven/")
                  }
              }
          }

          rootProject.name = "NEXUS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexus.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexus.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 4
                  versionName '0.4.0'
              }

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += [
                          "libsignal_jni*.dylib",
                          "signal_jni*.dll"
                      ]
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
              implementation 'org.signal:libsignal-client:0.102.2'
              implementation 'org.signal:libsignal-android:0.102.2'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="NEXUS"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00C2FF</item>
                  <item name="android:statusBarColor">#080A0F</item>
                  <item name="android:navigationBarColor">#080A0F</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/nexus/app/MainActivity.java <<'EOF'
          package com.nexus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private final int BG = Color.rgb(8,10,15);
              private final int CARD = Color.rgb(20,24,32);
              private final int BLUE = Color.rgb(0,194,255);
              private final Handler handler = new Handler();

              private int dp(int value) {
                  return (int)(value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(String value, float size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  return t;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  showHome();
              }

              private LinearLayout page(String title) {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(24), dp(18), dp(18));
                  root.setBackgroundColor(BG);

                  TextView titleView = text(title, 28);
                  titleView.setTypeface(Typeface.DEFAULT, Typeface.BOLD);

                  root.addView(
                      titleView,
                      new LinearLayout.LayoutParams(-1, dp(55))
                  );

                  return root;
              }

              private Button button(String value) {
                  Button b = new Button(this);
                  b.setText(value);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(16);
                  b.setAllCaps(false);
                  b.setBackgroundColor(CARD);
                  return b;
              }

              private void showHome() {
                  LinearLayout root = page("NEXUS");

                  TextView subtitle =
                      text("Özel ve güvenli mesajlaşma", 15);
                  subtitle.setTextColor(Color.LTGRAY);

                  root.addView(subtitle);

                  TextView chats = text("Sohbetler", 20);
                  chats.setPadding(0, dp(25), 0, dp(10));
                  root.addView(chats);

                  Button ali = button("Ali\nÇevrimiçi");
                  root.addView(
                      ali,
                      new LinearLayout.LayoutParams(-1, dp(75))
                  );

                  ali.setOnClickListener(v -> showChat("Ali"));

                  Button zeynep = button("Zeynep\nSon mesaj gizli");
                  LinearLayout.LayoutParams zp =
                      new LinearLayout.LayoutParams(-1, dp(75));
                  zp.topMargin = dp(10);
                  root.addView(zeynep, zp);

                  zeynep.setOnClickListener(
                      v -> showChat("Zeynep")
                  );

                  Button newChat = button("+ Yeni sohbet");

                  LinearLayout.LayoutParams np =
                      new LinearLayout.LayoutParams(-1, dp(60));
                  np.topMargin = dp(20);

                  root.addView(newChat, np);

                  newChat.setOnClickListener(
                      v -> showNewChat()
                  );

                  TextView info = text(
                      "\nNEXUS E2EE\n\n" +
                      "Mesaj içeriği bildirimlerde gösterilmez.\n" +
                      "Ekran görüntüsü ve ekran kaydı korunur.",
                      13
                  );

                  info.setTextColor(Color.GRAY);
                  root.addView(info);

                  setContentView(root);
              }

              private void showNewChat() {
                  LinearLayout root = page("Yeni sohbet");

                  EditText username = new EditText(this);
                  username.setHint("Kullanıcı adı");
                  username.setHintTextColor(Color.GRAY);
                  username.setTextColor(Color.WHITE);

                  root.addView(
                      username,
                      new LinearLayout.LayoutParams(-1, dp(60))
                  );

                  Button start = button("Sohbeti başlat");

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(-1, dp(60));
                  p.topMargin = dp(15);

                  root.addView(start, p);

                  start.setOnClickListener(v -> {
                      String name =
                          username.getText().toString().trim();

                      if (name.isEmpty()) {
                          name = "Yeni kişi";
                      }

                      showChat(name);
                  });

                  setContentView(root);
              }

              private void showChat(String person) {
                  LinearLayout root = page(person);

                  Button back = button("‹ Sohbetlere dön");
                  root.addView(
                      back,
                      0,
                      new LinearLayout.LayoutParams(-1, dp(48))
                  );

                  back.setOnClickListener(v -> showHome());

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout messages =
                      new LinearLayout(this);

                  messages.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  messages.setPadding(
                      0, dp(10), 0, dp(10)
                  );

                  scroll.addView(messages);

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1, 0, 1
                      )
                  );

                  LinearLayout inputBar =
                      new LinearLayout(this);

                  inputBar.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  EditText input = new EditText(this);
                  input.setHint("Mesaj…");
                  input.setHintTextColor(Color.GRAY);
                  input.setTextColor(Color.WHITE);

                  Button send = button("Gönder");

                  inputBar.addView(
                      input,
                      new LinearLayout.LayoutParams(
                          0, dp(60), 1
                      )
                  );

                  inputBar.addView(
                      send,
                      new LinearLayout.LayoutParams(
                          dp(95), dp(60)
                      )
                  );

                  root.addView(inputBar);

                  send.setOnClickListener(v -> {

                      String message =
                          input.getText().toString().trim();

                      if (message.isEmpty()) {
                          return;
                      }

                      addMessage(
                          messages,
                          message
                      );

                      input.setText("");

                      scroll.post(
                          () -> scroll.fullScroll(
                              View.FOCUS_DOWN
                          )
                      );
                  });

                  setContentView(root);
              }

              private void addMessage(
                  LinearLayout parent,
                  String message
              ) {

                  TextView bubble =
                      text(
                          message +
                          "\n\n✓ Okundu • 60 saniye",
                          15
                      );

                  bubble.setTextColor(Color.WHITE);
                  bubble.setPadding(
                      dp(14),
                      dp(10),
                      dp(14),
                      dp(10)
                  );

                  bubble.setBackgroundColor(
                      Color.rgb(0,80,105)
                  );

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(85)
                      );

                  p.topMargin = dp(8);

                  parent.addView(bubble, p);

                  handler.postDelayed(() -> {

                      if (bubble.getParent() != null) {
                          ((LinearLayout)
                              bubble.getParent())
                              .removeView(bubble);
                      }

                  }, 60000);
              }
          }
          EOF

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-UI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk