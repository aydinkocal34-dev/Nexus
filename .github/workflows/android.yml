          package com.nexus.app;

          import android.content.Context;
          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import androidx.test.platform.app.InstrumentationRegistry;

          import org.junit.Test;
          import org.junit.runner.RunWith;

          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicReference;

          import static org.junit.Assert.*;

          @RunWith(AndroidJUnit4.class)
          public class LiveE2eeTransportInstrumentedTest {
              @Test
              public void twoIndependentDevicesExchangeRealE2eeMessageThroughLiveRelay() throws Exception {
                  Context context = InstrumentationRegistry.getInstrumentation().getTargetContext();
                  final String alice = "ci-alice-" + System.currentTimeMillis();
                  final String bob = "ci-bob-" + System.currentTimeMillis();
                  final String plaintext = "NEXUS-LIVE-E2EE-" + System.currentTimeMillis();

                  CountDownLatch ready = new CountDownLatch(2);
                  CountDownLatch received = new CountDownLatch(1);
                  CountDownLatch errorSeen = new CountDownLatch(1);
                  AtomicReference<String> clear = new AtomicReference<>();
                  AtomicReference<String> error = new AtomicReference<>();

                  RealE2eeTransport.Listener listener = new RealE2eeTransport.Listener() {
                      @Override public void onReady() { ready.countDown(); }
                      @Override public void onMessage(String from, String message, String id) {
                          clear.set(message);
                          received.countDown();
                      }
                      @Override public void onDelivery(String id, String status) {}
                      @Override public void onError(String message) {
                          error.compareAndSet(null, message);
                          errorSeen.countDown();
                      }
                  };

                  RealE2eeTransport bobTransport = new RealE2eeTransport(context, bob, 1, listener);
                  RealE2eeTransport aliceTransport = new RealE2eeTransport(context, alice, 1, listener);

                  try {
                      bobTransport.connect("wss://nexus-blind-relay.onrender.com");
                      aliceTransport.connect("wss://nexus-blind-relay.onrender.com");

                      boolean connected = ready.await(45, TimeUnit.SECONDS);
                      if (!connected) {
                          fail("E2EE transports did not connect within 45s. Relay/transport error: " + error.get());
                      }
                      assertNull("Relay/transport error during connect: " + error.get(), error.get());

                      aliceTransport.sendText(bob, 1, plaintext);

                      long deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(35);
                      while (received.getCount() != 0 && errorSeen.getCount() != 0 &&
                              System.nanoTime() < deadline) {
                          Thread.sleep(100);
                      }

                      if (received.getCount() != 0) {
                          fail("B did not receive decrypted message. E2EE/relay error: " + error.get());
                      }

                      assertEquals(plaintext, clear.get());
                      assertNull("E2EE/relay error: " + error.get(), error.get());
                  } finally {
                      aliceTransport.close();
                      bobTransport.close();
                  }
              }
          }
