name: NEXUS Android Build

concurrency:
  group: nexus-android-ci
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDK" --licenses >/dev/null 2>&1 || true

          "$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator"

      - name: Gradle
        run: |
          rm -rf /tmp/nexus-gradle

          mkdir -p /tmp/nexus-gradle

          cd /tmp/nexus-gradle

          printf 'rootProject.name="bootstrap"\n' \
            > settings.gradle

          gradle wrapper --gradle-version 9.5.1

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/nexus/app app/src/main/res/drawable

          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/nexus/app

          cat > settings.gradle <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()

                  maven {
                      url = uri(
                          "https://build-artifacts.signal.org/libraries/maven/"
                      )
                  }
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()

                  maven {
                      url = uri(
                          "https://build-artifacts.signal.org/libraries/maven/"
                      )
                  }
              }
          }

          rootProject.name = "NEXUS"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexus.app'

              compileSdk 35

              // Android must not package libsignal-client's desktop JNI resources.
          // Native.kt prefers architecture-suffixed root resources; on x86_64 that can
          // otherwise select libsignal_jni_amd64.so from libsignal-client instead of
          // the Android JNI supplied by libsignal-android.
          packaging {
              resources {
                  excludes += [
                      'libsignal_jni.so',
                      'libsignal_jni_amd64.so',
                      'libsignal_jni_amd64.dylib',
                      'libsignal_jni_aarch64.dylib',
                      'signal_jni_amd64.dll'
                  ]
              }
          }

          defaultConfig {
                  applicationId 'com.nexus.app'

                  minSdk 26
                  targetSdk 35

                  versionCode 29
                  versionName '0.22.0-live-chat'

                  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
              }

              compileOptions {
                  coreLibraryDesugaringEnabled true

                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              // Build ARM64 for real phones and x86_64 for the CI emulator. The emulator runs x86_64,\n              // so omitting this ABI can leave the test process with the wrong libsignal native binary.
              splits {
                  abi {
                      enable true
                      reset()
                      include "arm64-v8a", "x86_64"
                      universalApk false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.15.0'

              implementation 'com.squareup.okhttp3:okhttp:4.12.0'

              implementation 'org.signal:libsignal-client:0.102.2'
              implementation 'org.signal:libsignal-android:0.102.2'

              coreLibraryDesugaring \
                  'com.android.tools:desugar_jdk_libs:2.1.5'

              testImplementation 'junit:junit:4.13.2'
              androidTestImplementation 'androidx.test:runner:1.6.2'
              androidTestImplementation 'androidx.test.ext:junit:1.2.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET"/>

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="NEXUS"
                  android:allowBackup="false"
                  android:icon="@drawable/nexus_logo"
                  android:roundIcon="@drawable/nexus_logo">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/drawable/nexus_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#071426" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#12A8FF" android:pathData="M24,76V30c0,-6 4,-10 9,-10s9,4 9,10v46c0,4 -4,8 -9,8s-9,-4 -9,-8z"/>
              <path android:fillColor="#2C6BFF" android:pathData="M66,78V32c0,-5 4,-9 9,-9s9,4 9,9v46c0,5 -4,9 -9,9s-9,-4 -9,-9z"/>
              <path android:fillColor="#8A4DFF" android:pathData="M34,25l40,54c3,4 8,5 12,2l4,-3L50,24c-3,-4 -8,-5 -12,-2z"/>
              <path android:fillColor="#35D7FF" android:pathData="M34,79l38,-53c3,-4 8,-5 12,-2l4,3L50,81c-3,4 -8,5 -12,2z"/>
          </vector>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/nexus/app/PersistentSignalProtocolStore.java <<'EOF'
          package com.nexus.app;

          import org.signal.libsignal.protocol.IdentityKey;
          import org.signal.libsignal.protocol.IdentityKeyPair;
          import org.signal.libsignal.protocol.NoSessionException;
          import org.signal.libsignal.protocol.ReusedBaseKeyException;
          import org.signal.libsignal.protocol.SignalProtocolAddress;
          import org.signal.libsignal.protocol.InvalidKeyIdException;
          import org.signal.libsignal.protocol.groups.state.SenderKeyRecord;
          import org.signal.libsignal.protocol.state.KyberPreKeyRecord;
          import org.signal.libsignal.protocol.state.PreKeyRecord;
          import org.signal.libsignal.protocol.state.SessionRecord;
          import org.signal.libsignal.protocol.state.SignedPreKeyRecord;
          import org.signal.libsignal.protocol.state.impl.InMemorySignalProtocolStore;
          import org.signal.libsignal.protocol.ecc.ECPublicKey;
          import android.content.Context;
          import android.util.Base64;

          import java.nio.charset.StandardCharsets;
          import java.security.SecureRandom;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.UUID;

          /**
           * Persistent Signal store backed by Android Keystore-encrypted state.
           * Libsignal record serialization remains owned by libsignal; this class only persists
           * those opaque records and never implements cryptography itself.
           */
          public final class PersistentSignalProtocolStore extends InMemorySignalProtocolStore {
              private final EncryptedStateStore storage;
              private final String namespace;

              public PersistentSignalProtocolStore(Context context, String namespace) throws Exception {
                  super(loadIdentity(context, namespace), loadRegistrationId(context, namespace));
                  this.storage = new EncryptedStateStore(context);
                  this.namespace = namespace;
              }

              private static IdentityKeyPair loadIdentity(Context context, String ns) throws Exception {
                  EncryptedStateStore s = new EncryptedStateStore(context);
                  byte[] bytes = s.get(key(ns, "identity"));
                  if (bytes != null) return new IdentityKeyPair(bytes);
                  IdentityKeyPair pair = IdentityKeyPair.generate();
                  s.put(key(ns, "identity"), pair.serialize());
                  return pair;
              }

              private static int loadRegistrationId(Context context, String ns) throws Exception {
                  EncryptedStateStore s = new EncryptedStateStore(context);
                  byte[] bytes = s.get(key(ns, "registration"));
                  if (bytes != null) return Integer.parseInt(new String(bytes, StandardCharsets.UTF_8));
                  int id = 1 + new SecureRandom().nextInt(16379);
                  s.put(key(ns, "registration"), Integer.toString(id).getBytes(StandardCharsets.UTF_8));
                  return id;
              }

              private static String key(String ns, String suffix) {
                  return "signal/" + ns + "/" + suffix;
              }

              private String k(String type, String id) {
                  return key(namespace, type + "/" + id);
              }

              private static String addressId(SignalProtocolAddress a) {
                  return Base64.encodeToString(a.getName().getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP)
                          + "_" + a.getDeviceId();
              }

              private byte[] get(String k) throws Exception { return storage.get(k); }
              private void put(String k, byte[] v) throws Exception { storage.put(k, v); }
              private void remove(String k) { storage.remove(k); }

              private List<String> index(String type) throws Exception {
                  byte[] b = get(k("index", type));
                  List<String> out = new ArrayList<>();
                  if (b == null || b.length == 0) return out;
                  for (String x : new String(b, StandardCharsets.UTF_8).split("\n")) {
                      if (!x.isEmpty()) out.add(x);
                  }
                  return out;
              }

              private void addIndex(String type, String id) throws Exception {
                  List<String> xs = index(type);
                  if (!xs.contains(id)) xs.add(id);
                  put(k("index", type), String.join("\n", xs).getBytes(StandardCharsets.UTF_8));
              }

              private void removeIndex(String type, String id) throws Exception {
                  List<String> xs = index(type);
                  xs.remove(id);
                  put(k("index", type), String.join("\n", xs).getBytes(StandardCharsets.UTF_8));
              }

              @Override public void storeSession(SignalProtocolAddress a, SessionRecord r) {
                  super.storeSession(a, r);
                  try { put(k("session", addressId(a)), r.serialize()); addIndex("session", addressId(a)); }
                  catch (Exception e) { throw new IllegalStateException("Persistent session write failed", e); }
              }

              @Override public SessionRecord loadSession(SignalProtocolAddress a) {
                  try {
                      byte[] b = get(k("session", addressId(a)));
                      if (b != null) {
                          SessionRecord r = new SessionRecord(b);
                          super.storeSession(a, r);
                          return r;
                      }
                  } catch (Exception e) { throw new IllegalStateException("Persistent session read failed", e); }
                  return super.loadSession(a);
              }

              @Override public boolean containsSession(SignalProtocolAddress a) {
                  try { if (get(k("session", addressId(a))) != null) return true; }
                  catch (Exception e) { throw new IllegalStateException(e); }
                  return super.containsSession(a);
              }

              @Override public void deleteSession(SignalProtocolAddress a) {
                  super.deleteSession(a);
                  try { remove(k("session", addressId(a))); removeIndex("session", addressId(a)); }
                  catch (Exception e) { throw new IllegalStateException(e); }
              }

              @Override public void deleteAllSessions(String name) {
                  try {
                      for (String id : index("session")) {
                          byte[] b = get(k("session", id));
                          if (b != null) {
                              // index entries encode the name, so only remove matching decoded prefix.
                              String encodedName = id.substring(0, id.lastIndexOf('_'));
                              String decoded = new String(Base64.decode(encodedName, Base64.NO_WRAP), StandardCharsets.UTF_8);
                              if (decoded.equals(name)) { remove(k("session", id)); removeIndex("session", id); }
                          }
                      }
                  } catch (Exception e) { throw new IllegalStateException(e); }
                  super.deleteAllSessions(name);
              }

              @Override public void storePreKey(int id, PreKeyRecord r) {
                  super.storePreKey(id, r);
                  try { put(k("prekey", Integer.toString(id)), r.serialize()); }
                  catch (Exception e) { throw new IllegalStateException(e); }
              }

              @Override public PreKeyRecord loadPreKey(int id) throws InvalidKeyIdException {
                  try {
                      byte[] b = get(k("prekey", Integer.toString(id)));
                      if (b != null) return new PreKeyRecord(b);
                  } catch (Exception e) { throw new IllegalStateException(e); }
                  return super.loadPreKey(id);
              }

              @Override public boolean containsPreKey(int id) {
                  try { if (get(k("prekey", Integer.toString(id))) != null) return true; }
                  catch (Exception e) { throw new IllegalStateException(e); }
                  return super.containsPreKey(id);
              }

              @Override public void removePreKey(int id) {
                  super.removePreKey(id); remove(k("prekey", Integer.toString(id)));
              }

              @Override public void storeSignedPreKey(int id, SignedPreKeyRecord r) {
                  super.storeSignedPreKey(id, r);
                  try { put(k("signed", Integer.toString(id)), r.serialize()); addIndex("signed", Integer.toString(id)); }
                  catch (Exception e) { throw new IllegalStateException(e); }
              }

              @Override public SignedPreKeyRecord loadSignedPreKey(int id) throws InvalidKeyIdException {
                  try {
                      byte[] b = get(k("signed", Integer.toString(id)));
                      if (b != null) return new SignedPreKeyRecord(b);
                  } catch (Exception e) { throw new IllegalStateException(e); }
                  return super.loadSignedPreKey(id);
              }

              @Override public List<SignedPreKeyRecord> loadSignedPreKeys() {
                  try {
                      List<SignedPreKeyRecord> out = new ArrayList<>();
                      for (String id : index("signed")) {
                          byte[] b = get(k("signed", id));
                          if (b != null) out.add(new SignedPreKeyRecord(b));
                      }
                      return out;
                  } catch (Exception e) { throw new IllegalStateException(e); }
              }

              @Override public boolean containsSignedPreKey(int id) {
                  try { return get(k("signed", Integer.toString(id))) != null; }
                  catch (Exception e) { throw new IllegalStateException(e); }
              }

              @Override public void removeSignedPreKey(int id) {
                  super.removeSignedPreKey(id);
                  try { remove(k("signed", Integer.toString(id))); removeIndex("signed", Integer.toString(id)); }
                  catch (Exception e) { throw new IllegalStateException(e); }
              }

              @Override public void storeKyberPreKey(int id, KyberPreKeyRecord r) {
                  // libsignal 0.102.2 may expose an uninitialized in-memory Kyber map;
                  // persistence is authoritative for this store, so do not touch the parent map.
                  try { put(k("kyber", Integer.toString(id)), r.serialize()); addIndex("kyber", Integer.toString(id)); }
                  catch (Exception e) { throw new IllegalStateException("Persistent Kyber pre-key write failed", e); }
              }

              @Override public KyberPreKeyRecord loadKyberPreKey(int id) throws InvalidKeyIdException {
                  try {
                      byte[] b = get(k("kyber", Integer.toString(id)));
                      if (b != null) return new KyberPreKeyRecord(b);
                  } catch (Exception e) { throw new IllegalStateException(e); }
                  return super.loadKyberPreKey(id);
              }

              @Override public List<KyberPreKeyRecord> loadKyberPreKeys() {
                  try {
                      List<KyberPreKeyRecord> out = new ArrayList<>();
                      for (String id : index("kyber")) {
                          byte[] b = get(k("kyber", id));
                          if (b != null) out.add(new KyberPreKeyRecord(b));
                      }
                      return out;
                  } catch (Exception e) { throw new IllegalStateException(e); }
              }

              @Override public boolean containsKyberPreKey(int id) {
                  try { return get(k("kyber", Integer.toString(id))) != null; }
                  catch (Exception e) { throw new IllegalStateException(e); }
              }

              public void removeKyberPreKey(int id) {
                  try { remove(k("kyber", Integer.toString(id))); removeIndex("kyber", Integer.toString(id)); }
                  catch (Exception e) { throw new IllegalStateException("Persistent Kyber pre-key delete failed", e); }
              }

              @Override public void storeSenderKey(SignalProtocolAddress a, UUID distributionId, SenderKeyRecord r) {
                  super.storeSenderKey(a, distributionId, r);
                  try { put(k("sender", addressId(a) + "_" + distributionId), r.serialize()); }
                  catch (Exception e) { throw new IllegalStateException(e); }
              }

              @Override public SenderKeyRecord loadSenderKey(SignalProtocolAddress a, UUID distributionId) {
                  try {
                      byte[] b = get(k("sender", addressId(a) + "_" + distributionId));
                      if (b != null) return new SenderKeyRecord(b);
                  } catch (Exception e) { throw new IllegalStateException(e); }
                  return super.loadSenderKey(a, distributionId);
              }

              @Override public void markKyberPreKeyUsed(int id, int signedId, ECPublicKey baseKey)
                      throws ReusedBaseKeyException {
                  String marker = k("kyber-used", id + "/" + signedId + "/" +
                          Base64.encodeToString(baseKey.serialize(), Base64.NO_WRAP));
                  try {
                      if (get(marker) != null) throw new ReusedBaseKeyException("Kyber pre-key reuse detected");
                      // Persistent storage is authoritative; the libsignal in-memory Kyber map
                      // is not initialized in this store implementation, so never call super here.
                      put(marker, new byte[]{1});
                  } catch (ReusedBaseKeyException e) { throw e; }
                    catch (Exception e) { throw new IllegalStateException("Kyber replay-state write failed", e); }
              }

              public void clearNamespace() {
                  try {
                      for (String type : new String[]{"session","signed","kyber"}) {
                          for (String id : index(type)) remove(k(type,id));
                          remove(k("index",type));
                      }
                  } catch (Exception e) { throw new IllegalStateException(e); }
              }
          }
          EOF

          cat > app/src/main/java/com/nexus/app/E2eeSessionEngine.java <<'EOF'
          package com.nexus.app;

          import android.content.Context;
          import org.signal.libsignal.protocol.IdentityKey;
          import org.signal.libsignal.protocol.IdentityKeyPair;
          import org.signal.libsignal.protocol.SessionBuilder;
          import org.signal.libsignal.protocol.SessionCipher;
          import org.signal.libsignal.protocol.SignalProtocolAddress;
          import org.signal.libsignal.protocol.message.CiphertextMessage;
          import org.signal.libsignal.protocol.message.PreKeySignalMessage;
          import org.signal.libsignal.protocol.message.SignalMessage;
          import org.signal.libsignal.protocol.ecc.ECKeyPair;
          import org.signal.libsignal.protocol.kem.KEMKeyPair;
          import org.signal.libsignal.protocol.kem.KEMKeyType;
          import org.signal.libsignal.protocol.state.KyberPreKeyRecord;
          import org.signal.libsignal.protocol.state.PreKeyBundle;
          import org.signal.libsignal.protocol.state.PreKeyRecord;
          import org.signal.libsignal.protocol.state.SignedPreKeyRecord;
          import org.signal.libsignal.protocol.util.KeyHelper;
          import org.signal.libsignal.protocol.util.Medium;
          import java.nio.charset.StandardCharsets;
          import java.util.Random;

          public final class E2eeSessionEngine {
              private static final SignalProtocolAddress ALICE = new SignalProtocolAddress("NX-LOCAL-ALICE", 1);
              private static final SignalProtocolAddress BOB = new SignalProtocolAddress("NX-LOCAL-BOB", 1);
              private E2eeSessionEngine() {}

              public static String runPersistentRoundTrip(Context context) throws Exception {
                  PersistentSignalProtocolStore alice = new PersistentSignalProtocolStore(context, "smoke-alice");
                  PersistentSignalProtocolStore bob = new PersistentSignalProtocolStore(context, "smoke-bob");
                  alice.clearNamespace(); bob.clearNamespace();

                  createBundle(bob);
                  new SessionBuilder(alice, BOB, ALICE).process(createBundle(bob));
                  SessionCipher a = new SessionCipher(alice, ALICE, BOB);
                  SessionCipher b = new SessionCipher(bob, BOB, ALICE);

                  byte[] first = "NEXUS PERSISTENT E2EE".getBytes(StandardCharsets.UTF_8);
                  byte[] clear = decrypt(b, a.encrypt(first));
                  if (!java.util.Arrays.equals(first, clear)) throw new IllegalStateException("First E2EE message failed");

                  // Simulate process death: construct fresh store objects from the same encrypted state.
                  alice = new PersistentSignalProtocolStore(context, "smoke-alice");
                  bob = new PersistentSignalProtocolStore(context, "smoke-bob");
                  a = new SessionCipher(alice, ALICE, BOB);
                  b = new SessionCipher(bob, BOB, ALICE);

                  byte[] second = "SESSION SURVIVED RESTART".getBytes(StandardCharsets.UTF_8);
                  clear = decrypt(b, a.encrypt(second));
                  if (!java.util.Arrays.equals(second, clear)) throw new IllegalStateException("Persistent session failed");

                  return "PERSISTENT E2EE ACTIVE\nSession survived store reload\nKeystore AES-256-GCM + libsignal ratchet OK";
              }

              private static byte[] decrypt(SessionCipher receiver, CiphertextMessage encrypted) throws Exception {
                  if (encrypted.getType() == CiphertextMessage.PREKEY_TYPE)
                      return receiver.decrypt(new PreKeySignalMessage(encrypted.serialize()));
                  if (encrypted.getType() == CiphertextMessage.WHISPER_TYPE)
                      return receiver.decrypt(new SignalMessage(encrypted.serialize()));
                  throw new IllegalStateException("Unknown ciphertext type: " + encrypted.getType());
              }

              private static PreKeyBundle createBundle(PersistentSignalProtocolStore device) throws Exception {
                  // Reuse the existing active pre-key set when possible.
                  ECKeyPair preKey = ECKeyPair.generate();
                  ECKeyPair signedPreKey = ECKeyPair.generate();
                  byte[] signedSignature = device.getIdentityKeyPair().getPrivateKey()
                          .calculateSignature(signedPreKey.getPublicKey().serialize());
                  KEMKeyPair kyber = KEMKeyPair.generate(KEMKeyType.KYBER_1024);
                  byte[] kyberSignature = device.getIdentityKeyPair().getPrivateKey()
                          .calculateSignature(kyber.getPublicKey().serialize());

                  Random random = new Random();
                  int preKeyId = random.nextInt(Medium.MAX_VALUE);
                  int signedPreKeyId = random.nextInt(Medium.MAX_VALUE);
                  int kyberPreKeyId = random.nextInt(Medium.MAX_VALUE);
                  device.storePreKey(preKeyId, new PreKeyRecord(preKeyId, preKey));
                  device.storeSignedPreKey(signedPreKeyId, new SignedPreKeyRecord(signedPreKeyId, System.currentTimeMillis(), signedPreKey, signedSignature));
                  device.storeKyberPreKey(kyberPreKeyId, new KyberPreKeyRecord(kyberPreKeyId, System.currentTimeMillis(), kyber, kyberSignature));

                  return new PreKeyBundle(device.getLocalRegistrationId(), 1, preKeyId, preKey.getPublicKey(),
                          signedPreKeyId, signedPreKey.getPublicKey(), signedSignature,
                          device.getIdentityKeyPair().getPublicKey(), kyberPreKeyId,
                          kyber.getPublicKey(), kyberSignature);
              }
          }
          EOF
          cat > app/src/main/java/com/nexus/app/RelayClient.java <<'EOF'
          package com.nexus.app;

          import android.os.Handler;
          import android.os.Looper;

          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;

          import org.json.JSONObject;

          import java.util.Base64;
          import java.util.concurrent.TimeUnit;

          /**
           * Thin transport client. It never accepts or exposes plaintext message content.
           * The ciphertext supplied to sendCiphertext() is produced by libsignal.
           */
          public final class RelayClient {
              public interface Listener {
                  void onConnected();
                  void onPreKeyRequest(String id, String from, long expiresAt);
                  void onPreKey(String id, String from, String bundle, long expiresAt);
                  void onCiphertext(String id, String from, int fromDeviceId, byte[] ciphertext, int ciphertextType, long expiresAt);
                  void onDelivery(String id, String status);
                  void onError(String message);
                  void onClosed();
              }

              private final OkHttpClient client = new OkHttpClient.Builder()
                      .readTimeout(0, TimeUnit.MILLISECONDS)
                      .build();
              private final Handler main = new Handler(Looper.getMainLooper());
              private final Listener listener;
              private WebSocket socket;

              public RelayClient(Listener listener) {
                  this.listener = listener;
              }

              public void connect(String wsUrl, String peerId) {
                  if (wsUrl == null || !wsUrl.startsWith("wss://")) {
                      main.post(() -> listener.onError("Relay requires WSS/TLS"));
                      return;
                  }
                  if (peerId == null || peerId.length() < 8 || peerId.length() > 128) {
                      main.post(() -> listener.onError("Invalid peer ID"));
                      return;
                  }
                  Request request = new Request.Builder().url(wsUrl).build();
                  socket = client.newWebSocket(request, new WebSocketListener() {
                      @Override public void onOpen(WebSocket webSocket, Response response) {
                          JSONObject msg = new JSONObject();
                          try {
                              msg.put("type", "register");
                              msg.put("peerId", peerId);
                              webSocket.send(msg.toString());
                          } catch (Exception e) {
                              main.post(() -> listener.onError(e.getMessage()));
                          }
                      }

                      @Override public void onMessage(WebSocket webSocket, String text) {
                          try {
                              JSONObject msg = new JSONObject(text);
                              String type = msg.optString("type");
                              if ("registered".equals(type)) {
                                  main.post(listener::onConnected);
                              } else if ("prekey-request".equals(type)) {
                                  String id = msg.getString("id");
                                  String from = msg.getString("from");
                                  long expiresAt = msg.getLong("expiresAt");
                                  main.post(() -> listener.onPreKeyRequest(id, from, expiresAt));
                              } else if ("ciphertext".equals(type)) {
                                  String id = msg.getString("id");
                                  String from = msg.getString("from");
                                  byte[] ciphertext = Base64.getDecoder().decode(msg.getString("ciphertext"));
                                  long expiresAt = msg.getLong("expiresAt");
                                  int fromDeviceId = msg.optInt("fromDeviceId", 1);
                                  main.post(() -> listener.onCiphertext(id, from, fromDeviceId, ciphertext, msg.optInt("ciphertextType", 0), expiresAt));
                              } else if ("prekey".equals(type)) {
                                  String id = msg.getString("id");
                                  String from = msg.getString("from");
                                  String bundle = msg.getString("bundle");
                                  long expiresAt = msg.getLong("expiresAt");
                                  main.post(() -> listener.onPreKey(id, from, bundle, expiresAt));
                              } else if ("delivery".equals(type)) {
                                  String id = msg.getString("id");
                                  String status = msg.getString("status");
                                  main.post(() -> listener.onDelivery(id, status));
                              } else if ("error".equals(type)) {
                                  main.post(() -> listener.onError(msg.optString("code", "RELAY_ERROR")));
                              }
                          } catch (Exception e) {
                              main.post(() -> listener.onError("Invalid relay frame"));
                          }
                      }

                      @Override public void onFailure(WebSocket webSocket, Throwable t, Response response) {
                          main.post(() -> listener.onError(t.getMessage() == null ? "Relay connection failed" : t.getMessage()));
                      }

                      @Override public void onClosed(WebSocket webSocket, int code, String reason) {
                          main.post(listener::onClosed);
                      }
                  });
              }

              public boolean sendCiphertext(String id, String toPeerId, byte[] ciphertext, long ttlMs) {
                  return sendCiphertext(id, toPeerId, ciphertext, 0, 1, ttlMs);
              }

              public boolean sendCiphertext(String id, String toPeerId, byte[] ciphertext, int ciphertextType, int fromDeviceId, long ttlMs) {
                  if (socket == null) return false;
                  try {
                      JSONObject msg = new JSONObject();
                      msg.put("type", "relay");
                      msg.put("id", id);
                      msg.put("to", toPeerId);
                      msg.put("ciphertext", Base64.getEncoder().encodeToString(ciphertext));
                      msg.put("ciphertextType", ciphertextType);
                      msg.put("fromDeviceId", fromDeviceId);
                      msg.put("ttlMs", Math.max(1000L, ttlMs));
                      return socket.send(msg.toString());
                  } catch (Exception e) {
                      main.post(() -> listener.onError("Could not encode relay frame"));
                      return false;
                  }
              }

              public boolean requestPreKey(String id, String toPeerId, long ttlMs) {
                  if (socket == null) return false;
                  try {
                      JSONObject msg = new JSONObject();
                      msg.put("type", "prekey-request");
                      msg.put("id", id);
                      msg.put("to", toPeerId);
                      msg.put("ttlMs", Math.max(1000L, ttlMs));
                      return socket.send(msg.toString());
                  } catch (Exception e) {
                      main.post(() -> listener.onError("Could not encode prekey request"));
                      return false;
                  }
              }

              public boolean sendPreKey(String id, String toPeerId, String bundle, long ttlMs) {
                  if (socket == null) return false;
                  try {
                      JSONObject msg = new JSONObject();
                      msg.put("type", "prekey");
                      msg.put("id", id);
                      msg.put("to", toPeerId);
                      msg.put("bundle", bundle);
                      msg.put("ttlMs", Math.max(1000L, ttlMs));
                      return socket.send(msg.toString());
                  } catch (Exception e) {
                      main.post(() -> listener.onError("Could not encode prekey frame"));
                      return false;
                  }
              }

              public boolean sendReadReceipt(String id, String toPeerId) {
                  if (socket == null) return false;
                  try {
                      JSONObject msg = new JSONObject();
                      msg.put("type", "ack");
                      msg.put("id", id);
                      msg.put("to", toPeerId);
                      return socket.send(msg.toString());
                  } catch (Exception e) {
                      main.post(() -> listener.onError("Could not encode read receipt"));
                      return false;
                  }
              }

              public void close() {
                  if (socket != null) socket.close(1000, "client closing");
                  client.dispatcher().executorService().shutdown();
              }
          }
