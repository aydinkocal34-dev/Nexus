      - name: Resolve app dependencies
        run: |
          /tmp/nexus-gradle/gradlew \
            -p "$GITHUB_WORKSPACE" \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            --stacktrace

      - name: Inspect libsignal API
        run: |
          mkdir -p api-report

          CACHE="$HOME/.gradle/caches/modules-2/files-2.1/org.signal"
          ALLCACHE="$HOME/.gradle/caches"

          echo "=== LIBSIGNAL CACHE ===" \
            > api-report/libsignal.txt

          if [ -d "$CACHE" ]; then
            find "$CACHE" \
              -type f \
              | sort \
              >> api-report/libsignal.txt
          else
            echo "Signal cache bulunamadı." \
              >> api-report/libsignal.txt
          fi

          echo "" \
            >> api-report/libsignal.txt

          echo "=== JAR CONTENTS ===" \
            >> api-report/libsignal.txt

          find "$CACHE" \
            -type f \
            \( -name "*.jar" -o -name "*.aar" \) \
            -print \
            | while read -r FILE; do

                echo "" \
                  >> api-report/libsignal.txt

                echo "===== $FILE =====" \
                  >> api-report/libsignal.txt

                if [[ "$FILE" == *.aar ]]; then
                  TMPDIR=$(mktemp -d)
                  unzip -q -o "$FILE" 'classes.jar' -d "$TMPDIR" || true
                  if [ -f "$TMPDIR/classes.jar" ]; then
                    jar tf "$TMPDIR/classes.jar" \
                      | grep -E 'org/signal/libsignal/.*(Session|PreKey|Identity|Protocol|Cipher|Address)' \
                      || true
                  fi
                  rm -rf "$TMPDIR"
                else
                  jar tf "$FILE" \
                    | grep -E 'org/signal/libsignal/.*(Session|PreKey|Identity|Protocol|Cipher|Address)' \
                    || true
                fi

              done

          echo "" \
            >> api-report/libsignal.txt

          echo "=== SESSION RELATED CLASSES ===" \
            >> api-report/libsignal.txt

          echo "=== ALL LIBSIGNAL ARTIFACTS ===" >> api-report/libsignal.txt
          find "$ALLCACHE" -type f \( -name "*libsignal*.jar" -o -name "*libsignal*.aar" \) | sort >> api-report/libsignal.txt

          find "$CACHE" \
            -type f \
            \( -name "*.jar" -o -name "*.aar" \) \
            -print \
            | while read -r FILE; do

                if [[ "$FILE" == *.aar ]]; then
                  TMPDIR=$(mktemp -d)
                  unzip -q -o "$FILE" 'classes.jar' -d "$TMPDIR" || true
                  if [ -f "$TMPDIR/classes.jar" ]; then
                    jar tf "$TMPDIR/classes.jar" \
                      | grep -E 'Session|PreKey|Identity|ProtocolAddress|Cipher' \
                      || true
                  fi
                  rm -rf "$TMPDIR"
                else
                  jar tf "$FILE" \
                    | grep -E 'Session|PreKey|Identity|ProtocolAddress|Cipher' \
                    || true
                fi

              done \
              | sort -u \
              >> api-report/libsignal.txt

      - name: Generate session API contract report
        run: |
          mkdir -p api-report
          echo "Session API contract report generation deferred to Gradle test runtime." > api-report/session-api-contract.txt
          echo "libsignal 0.102.2 artifacts were resolved successfully." >> api-report/session-api-contract.txt

      - name: Run tests
        run: |
          /tmp/nexus-gradle/gradlew \
            -p "$GITHUB_WORKSPACE" \
            :app:test \
            --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Warm and verify live relay
        run: |
          set -e
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-connrefused \
            https://nexus-blind-relay.onrender.com/health
          echo

      - name: Run live Android E2EE test
        timeout-minutes: 10
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            adb shell getprop sys.boot_completed
            /tmp/nexus-gradle/gradlew               -p "$GITHUB_WORKSPACE"               :app:connectedDebugAndroidTest               --stacktrace

      - name: Build APK
        run: |
          /tmp/nexus-gradle/gradlew \
            -p "$GITHUB_WORKSPACE" \
            :app:assembleDebug \
            --stacktrace

      - name: Upload API report
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-0.22.0-live-chat-report
          path: api-report
          retention-days: 14

      - name: Prepare APK artifact
        run: |
          set -e
          mkdir -p dist
          find app/build/outputs/apk -type f -name "*.apk" -print
          APK="$(find app/build/outputs/apk/debug -type f -name "app-arm64-v8a-debug.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/NEXUS-0.22.0-arm64.apk
          ls -lh dist/NEXUS-0.22.0-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-0.22.0-live-chat-APK
          path: dist/NEXUS-0.22.0-arm64.apk
          retention-days: 14