name: NEXUS Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Android environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin" || true

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare isolated Gradle wrapper
        run: |
          rm -rf /tmp/nexus-gradle-bootstrap
          mkdir -p /tmp/nexus-gradle-bootstrap

          cd /tmp/nexus-gradle-bootstrap

          printf 'rootProject.name="nexus-bootstrap"\n' > settings.gradle

          gradle wrapper --gradle-version 9.5.1

          cp gradlew "$GITHUB_WORKSPACE/gradlew"
          cp -R gradle "$GITHUB_WORKSPACE/gradle"

          cd "$GITHUB_WORKSPACE"

          chmod +x gradlew

          echo "Gradle wrapper prepared successfully"
          ./gradlew --version

      - name: Create NEXUS project
        run: |

          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/nexus/app

          cat > settings.gradle <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven {
                      url = uri("https://build-artifacts.signal.org/libraries/maven/")
                  }
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url = uri("https://build-artifacts.signal.org/libraries/maven/")
                  }
              }
          }

          rootProject.name = "NEXUS"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle