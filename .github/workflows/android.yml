name: NEXUS Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle wrapper
        run: |
          mkdir -p gradle-bootstrap
          cd gradle-bootstrap
          gradle wrapper --gradle-version 9.5.1
          cp gradlew ../gradlew
          cp -R gradle ../gradle
          cd ..
          chmod +x gradlew

      - name: Create NEXUS project
        run: |
          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/test/java/com/nexus/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url = uri("https://build-artifacts.signal.org/libraries/maven/")
                  }
              }
          }

          rootProject.name = "NEXUS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexus.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexus.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 11
                  versionName '0.10.1-session-fix'

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.15.0'

              implementation 'com.squareup.okhttp3:okhttp:4.12.0'

              implementation 'org.signal:libsignal-client:0.102.2'
              implementation 'org.signal:libsignal-android:0.102.2'

              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

              testImplementation 'junit:junit:4.13.2'
          }
          EOF

      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:label="NEXUS">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create theme
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>

              </style>

          </resources>
          EOF

      - name: Create IdentityStore
        run: |
          cat > app/src/main/java/com/nexus/app/IdentityStore.java <<'EOF'
          package com.nexus.app;

          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;

          import java.nio.charset.StandardCharsets;
          import java.security.KeyPairGenerator;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.PublicKey;

          public final class IdentityStore {

              private static final String ANDROID_KEYSTORE = "AndroidKeyStore";
              private static final String ALIAS = "nexus_device_identity_v1";

              private IdentityStore() {}

              public static void ensureIdentity() throws Exception {

                  KeyStore keyStore = KeyStore.getInstance(ANDROID_KEYSTORE);
                  keyStore.load(null);

                  if (keyStore.containsAlias(ALIAS)) {
                      return;
                  }

                  KeyPairGenerator generator =
                          KeyPairGenerator.getInstance(
                                  KeyProperties.KEY_ALGORITHM_EC,
                                  ANDROID_KEYSTORE
                          );

                  KeyGenParameterSpec spec =
                          new KeyGenParameterSpec.Builder(
                                  ALIAS,
                                  KeyProperties.PURPOSE_SIGN |
                                          KeyProperties.PURPOSE_VERIFY
                          )
                                  .setAlgorithmParameterSpec(
                                          new java.security.spec.ECGenParameterSpec(
                                                  "secp256r1"
                                          )
                                  )
                                  .setDigests(
                                          KeyProperties.DIGEST_SHA256
                                  )
                                  .build();

                  generator.initialize(spec);
                  generator.generateKeyPair();
              }

              public static PublicKey getPublicKey() throws Exception {

                  KeyStore keyStore = KeyStore.getInstance(ANDROID_KEYSTORE);
                  keyStore.load(null);

                  return keyStore.getCertificate(ALIAS).getPublicKey();
              }

              public static String getFingerprint() throws Exception {

                  PublicKey publicKey = getPublicKey();

                  byte[] digest = MessageDigest
                          .getInstance("SHA-256")
                          .digest(
                                  publicKey
                                          .getEncoded()
                          );

                  StringBuilder builder = new StringBuilder();

                  for (byte b : digest) {
                      builder.append(
                              String.format("%02X", b)
                      );
                  }

                  return builder
                          .toString()
                          .substring(0, 32);
              }
          }
          EOF

      - name: Create SessionStore
        run: |
          cat > app/src/main/java/com/nexus/app/SessionStore.java <<'EOF'
          package com.nexus.app;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;

          public final class SessionStore {

              private static final String PREFS =
                      "nexus_signal_session_store";

              private static final String KEY_STATE =
                      "session_state";

              private SessionStore() {}

              private static SharedPreferences prefs(Context context) {
                  return context.getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                  );
              }

              public static void saveState(
                      Context context,
                      String state
              ) {
                  prefs(context)
                          .edit()
                          .putString(KEY_STATE, state)
                          .apply();
              }

              public static String loadState(
                      Context context
              ) {
                  return prefs(context)
                          .getString(KEY_STATE, null);
              }

              public static void clear(
                      Context context
              ) {
                  prefs(context)
                          .edit()
                          .remove(KEY_STATE)
                          .apply();
              }

              public static boolean exists(
                      Context context
              ) {
                  return loadState(context) != null;
              }

              public static String stateFingerprint(
                      Context context
              ) throws Exception {

                  String state = loadState(context);

                  if (state == null) {
                      return null;
                  }

                  byte[] digest =
                          MessageDigest
                                  .getInstance("SHA-256")
                                  .digest(
                                          state.getBytes(
                                                  StandardCharsets.UTF_8
                                          )
                                  );

                  StringBuilder builder =
                          new StringBuilder();

                  for (byte b : digest) {
                      builder.append(
                              String.format("%02X", b)
                      );
                  }

                  return builder
                          .toString()
                          .substring(0, 32);
              }
          }
          EOF

      - name: Create SignalSession
        run: |
          cat > app/src/main/java/com/nexus/app/SignalSession.java <<'EOF'
          package com.nexus.app;

          public final class SignalSession {

              private final String peerId;
              private final String peerFingerprint;

              private boolean established;

              public SignalSession(
                      String peerId,
                      String peerFingerprint
              ) {
                  this.peerId = peerId;
                  this.peerFingerprint = peerFingerprint;
                  this.established = false;
              }

              public String getPeerId() {
                  return peerId;
              }

              public String getPeerFingerprint() {
                  return peerFingerprint;
              }

              public boolean isEstablished() {
                  return established;
              }

              public void markEstablished() {
                  established = true;
              }

              public void markClosed() {
                  established = false;
              }
          }
          EOF

      - name: Create ReplayGuard
        run: |
          cat > app/src/main/java/com/nexus/app/ReplayGuard.java <<'EOF'
          package com.nexus.app;

          import java.util.HashSet;
          import java.util.Set;

          public final class ReplayGuard {

              private final Set<String> seenMessageIds =
                      new HashSet<>();

              public synchronized boolean accept(
                      String messageId
              ) {

                  if (messageId == null ||
                          messageId.isEmpty()) {
                      return false;
                  }

                  if (seenMessageIds.contains(messageId)) {
                      return false;
                  }

                  seenMessageIds.add(messageId);
                  return true;
              }

              public synchronized int size() {
                  return seenMessageIds.size();
              }

              public synchronized void clear() {
                  seenMessageIds.clear();
              }
          }
          EOF

      - name: Create SignalEngine
        run: |
          cat > app/src/main/java/com/nexus/app/SignalEngine.java <<'EOF'
          package com.nexus.app;

          import android.content.Context;

          public final class SignalEngine {

              public static final String VERSION =
                      "0.10.1-session-fix";

              public static final String LIBSIGNAL =
                      "0.102.2";

              private SignalEngine() {}

              public static boolean isSignalAvailable() {
                  return true;
              }

              public static void initialize(
                      Context context
              ) {

                  SessionStore.exists(context);
              }

              public static String status(
                      Context context
              ) {

                  if (SessionStore.exists(context)) {
                      return "Signal: session state mevcut";
                  }

                  return "Signal: session state yok";
              }
          }
          EOF

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/nexus/app/MainActivity.java <<'EOF'
          package com.nexus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE
                  );

                  try {
                      IdentityStore.ensureIdentity();
                      SignalEngine.initialize(this);

                      TextView session = new TextView(this);

                      session.setText(
                              "NEXUS\n\n" +
                              "0.10.1 SESSION FIX\n\n" +
                              "Device fingerprint:\n" +
                              IdentityStore.getFingerprint() +
                              "\n\n" +
                              "libsignal: " +
                              SignalEngine.LIBSIGNAL +
                              "\n\n" +
                              SignalEngine.status(this) +
                              "\n\n" +
                              "✓ Keystore identity\n" +
                              "✓ Session storage foundation\n" +
                              "✓ Peer session model\n" +
                              "✓ Replay protection\n\n" +
                              "Gerçek Signal session " +
                              "henüz kurulmuş değil."
                      );

                      session.setTextSize(16);
                      session.setPadding(
                              40,
                              80,
                              40,
                              40
                      );

                      setContentView(session);

                  } catch (Exception e) {

                      TextView error =
                              new TextView(this);

                      error.setText(
                              "NEXUS başlatılamadı:\n\n" +
                              e.getMessage()
                      );

                      error.setTextSize(16);

                      setContentView(error);
                  }
              }
          }
          EOF

      - name: Create tests
        run: |
          cat > app/src/test/java/com/nexus/app/SessionModelTest.java <<'EOF'
          package com.nexus.app;

          import org.junit.Test;

          import static org.junit.Assert.assertFalse;
          import static org.junit.Assert.assertTrue;

          public class SessionModelTest {

              @Test
              public void sessionStartsClosed() {

                  SignalSession session =
                          new SignalSession(
                                  "NX-TEST",
                                  "ABCDEF"
                          );

                  assertFalse(
                          session.isEstablished()
                  );
              }

              @Test
              public void sessionCanBeEstablished() {

                  SignalSession session =
                          new SignalSession(
                                  "NX-TEST",
                                  "ABCDEF"
                          );

                  session.markEstablished();

                  assertTrue(
                          session.isEstablished()
                  );
              }

              @Test
              public void sessionCanBeClosed() {

                  SignalSession session =
                          new SignalSession(
                                  "NX-TEST",
                                  "ABCDEF"
                          );

                  session.markEstablished();
                  session.markClosed();

                  assertFalse(
                          session.isEstablished()
                  );
              }
          }
          EOF

          cat > app/src/test/java/com/nexus/app/ReplayGuardTest.java <<'EOF'
          package com.nexus.app;

          import org.junit.Test;

          import static org.junit.Assert.assertFalse;
          import static org.junit.Assert.assertTrue;

          public class ReplayGuardTest {

              @Test
              public void firstMessageAccepted() {

                  ReplayGuard guard =
                          new ReplayGuard();

                  assertTrue(
                          guard.accept("message-1")
                  );
              }

              @Test
              public void duplicateRejected() {

                  ReplayGuard guard =
                          new ReplayGuard();

                  assertTrue(
                          guard.accept("message-1")
                  );

                  assertFalse(
                          guard.accept("message-1")
                  );
              }

              @Test
              public void differentMessagesAccepted() {

                  ReplayGuard guard =
                          new ReplayGuard();

                  assertTrue(
                          guard.accept("message-1")
                  );

                  assertTrue(
                          guard.accept("message-2")
                  );
              }

              @Test
              public void emptyMessageRejected() {

                  ReplayGuard guard =
                          new ReplayGuard();

                  assertFalse(
                          guard.accept("")
                  );
              }

              @Test
              public void nullMessageRejected() {

                  ReplayGuard guard =
                          new ReplayGuard();

                  assertFalse(
                          guard.accept(null)
                  );
              }
          }
          EOF

      - name: Run unit tests
        run: |
          ./gradlew test --stacktrace

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload NEXUS 0.10.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-SESSION-FIX-0.10.1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk