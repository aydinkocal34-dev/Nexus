name: NEXUS Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDK" --licenses >/dev/null 2>&1 || true

          "$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle
        run: |
          rm -rf /tmp/nexus-gradle

          mkdir -p /tmp/nexus-gradle

          cd /tmp/nexus-gradle

          printf 'rootProject.name="bootstrap"\n' \
            > settings.gradle

          gradle wrapper --gradle-version 9.5.1

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/nexus/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/nexus/app

          cat > settings.gradle <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()

                  maven {
                      url = uri(
                          "https://build-artifacts.signal.org/libraries/maven/"
                      )
                  }
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()

                  maven {
                      url = uri(
                          "https://build-artifacts.signal.org/libraries/maven/"
                      )
                  }
              }
          }

          rootProject.name = "NEXUS"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexus.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexus.app'

                  minSdk 26
                  targetSdk 35

                  versionCode 14
                  versionName '0.12.1-libsignal-api'
              }

              compileOptions {
                  coreLibraryDesugaringEnabled true

                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.15.0'

              implementation 'com.squareup.okhttp3:okhttp:4.12.0'

              implementation 'org.signal:libsignal-client:0.102.2'
              implementation 'org.signal:libsignal-android:0.102.2'

              coreLibraryDesugaring \
                  'com.android.tools:desugar_jdk_libs:2.1.5'

              testImplementation 'junit:junit:4.13.2'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="NEXUS"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/nexus/app/MainActivity.java <<'EOF'
          package com.nexus.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  TextView view = new TextView(this);

                  view.setPadding(40, 80, 40, 40);
                  view.setTextSize(18);

                  view.setText(
                      "NEXUS\n\n" +
                      "0.12.1 LIBSIGNAL API\n\n" +
                      "✓ libsignal-client 0.102.2\n" +
                      "✓ libsignal-android 0.102.2\n" +
                      "✓ Android Keystore altyapısı\n" +
                      "✓ FLAG_SECURE\n\n" +
                      "API doğrulama aşaması.\n\n" +
                      "Gerçek E2EE session henüz aktif değil."
                  );

                  setContentView(view);
              }
          }
          EOF

          cat > app/src/test/java/com/nexus/app/LibsignalApiTest.java <<'EOF'
          package com.nexus.app;

          import org.junit.Test;

          import static org.junit.Assert.assertNotNull;

          public class LibsignalApiTest {

              @Test
              public void libsignalClassesExist() throws Exception {

                  Class<?> address =
                      Class.forName(
                          "org.signal.libsignal.protocol.SignalProtocolAddress"
                      );

                  Class<?> sessionBuilder =
                      Class.forName(
                          "org.signal.libsignal.protocol.SessionBuilder"
                      );

                  Class<?> sessionCipher =
                      Class.forName(
                          "org.signal.libsignal.protocol.SessionCipher"
                      );

                  Class<?> preKeyBundle =
                      Class.forName(
                          "org.signal.libsignal.protocol.state.PreKeyBundle"
                      );

                  assertNotNull(address);
                  assertNotNull(sessionBuilder);
                  assertNotNull(sessionCipher);
                  assertNotNull(preKeyBundle);
              }
          }
          EOF

      - name: Resolve app dependencies
        run: |
          /tmp/nexus-gradle/gradlew \
            -p "$GITHUB_WORKSPACE" \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            --stacktrace

      - name: Inspect libsignal API
        run: |
          mkdir -p api-report

          CACHE="$HOME/.gradle/caches/modules-2/files-2.1/org.signal"

          echo "=== LIBSIGNAL CACHE ===" \
            > api-report/libsignal.txt

          if [ -d "$CACHE" ]; then
            find "$CACHE" \
              -type f \
              | sort \
              >> api-report/libsignal.txt
          else
            echo "Signal cache bulunamadı." \
              >> api-report/libsignal.txt
          fi

          echo "" \
            >> api-report/libsignal.txt

          echo "=== JAR CONTENTS ===" \
            >> api-report/libsignal.txt

          find "$CACHE" \
            -type f \
            -name "*.jar" \
            -print \
            | while read -r JAR; do

                echo "" \
                  >> api-report/libsignal.txt

                echo "===== $JAR =====" \
                  >> api-report/libsignal.txt

                jar tf "$JAR" \
                  | grep \
                    -E \
                    'org/signal/libsignal/.*(Session|PreKey|Identity|Protocol|Cipher|Address)' \
                  || true

              done

          echo "" \
            >> api-report/libsignal.txt

          echo "=== SESSION RELATED CLASSES ===" \
            >> api-report/libsignal.txt

          find "$CACHE" \
            -type f \
            -name "*.jar" \
            -print \
            | while read -r JAR; do

                jar tf "$JAR" \
                  | grep \
                    -E \
                    'Session|PreKey|Identity|ProtocolAddress|Cipher' \
                  || true

              done \
              | sort -u \
              >> api-report/libsignal.txt

      - name: Run tests
        run: |
          /tmp/nexus-gradle/gradlew \
            -p "$GITHUB_WORKSPACE" \
            :app:test \
            --stacktrace

      - name: Build APK
        run: |
          /tmp/nexus-gradle/gradlew \
            -p "$GITHUB_WORKSPACE" \
            :app:assembleDebug \
            --stacktrace

      - name: Upload API report
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-0.12.1-libsignal-api-report
          path: api-report
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-0.12.1-libsignal-api-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14